<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Sign PDF — FreeZip</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- PDF-Lib for In-Browser PDF Processing & Signature Embedding -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    html, body {
      overscroll-behavior-y: none;
    }
    .wireframe-container {
      border-left: none;
      border-right: none;
    }
    @media (min-width: 640px) {
      .wireframe-container {
        border-left: 1.5px solid rgba(203, 213, 225, 0.8);
        border-right: 1.5px solid rgba(203, 213, 225, 0.8);
      }
      .dark .wireframe-container {
        border-left: 1.5px solid rgba(51, 65, 85, 0.7);
        border-right: 1.5px solid rgba(51, 65, 85, 0.7);
      }
    }
    .safe-bottom {
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
    }
    /* Touch canvas drawing optimization */
    #signaturePad {
      touch-action: none;
    }
  </style>
</head>

<body class="bg-white sm:bg-slate-100/70 dark:bg-[#0D131F] sm:dark:bg-[#070b12] text-slate-800 dark:text-slate-100 min-h-[100dvh] font-sans transition-colors duration-200 antialiased flex flex-col overflow-x-hidden select-none">

  <!-- MOBILE-FIRST OUTER WRAPPER -->
  <div class="w-full max-w-[1140px] mx-auto px-0 sm:px-6 md:px-10 flex-1 flex flex-col">

    <!-- MINIMAL WIREFRAME CONTAINER -->
    <div class="wireframe-container bg-white dark:bg-[#0D131F] flex-1 flex flex-col justify-between sm:shadow-sm">

      <!-- MOBILE-FIRST HEADER -->
      <header class="border-b border-slate-200 dark:border-slate-800 px-4 sm:px-6 md:px-8 h-14 sm:h-16 flex items-center justify-between gap-2 sticky top-0 z-30 bg-white/95 dark:bg-[#0D131F]/95 backdrop-blur-md">
        <a href="https://www.freezip.site/" class="flex items-center gap-2.5 font-bold tracking-tight text-slate-900 dark:text-white group">
          <span class="w-8 h-8 rounded-lg bg-red-500 text-white flex items-center justify-center text-xs shadow-sm shadow-red-500/40 group-hover:rotate-6 transition-transform">
            <i class="fa-solid fa-shapes"></i>
          </span>
          <span class="text-base font-extrabold uppercase tracking-wide">
            Free<span class="text-red-500">Zip-Tools</span>
          </span>
        </a>

        <div class="flex items-center gap-2 shrink-0">
          <a href="https://www.freezip.site/" class="h-10 px-3 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-300 bg-slate-100/80 dark:bg-slate-800/60 hover:text-red-500 active:scale-95 transition-all flex items-center gap-1.5">
            <i class="fa-solid fa-arrow-left text-[11px]"></i>
            <span>Home</span>
          </a>
          <button onclick="toggleTheme()" aria-label="Toggle Theme" class="w-10 h-10 rounded-xl border border-slate-200 dark:border-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300 active:scale-95 transition-all">
            <i id="themeIcon" class="fa-solid fa-moon text-sm"></i>
          </button>
        </div>
      </header>

      <!-- MOBILE-FIRST MAIN WORKSPACE -->
      <main class="flex-1 flex flex-col justify-center px-4 py-5 sm:p-8 md:p-12 w-full">
        <div class="w-full max-w-md mx-auto border border-slate-200/90 dark:border-slate-800 rounded-2xl bg-slate-50/70 dark:bg-[#111827]/80 p-5 sm:p-7 text-center space-y-5 shadow-sm">

          <!-- Website Logo & Brand Identity Badge -->
          <div class="flex flex-col items-center justify-center gap-2 pt-1">
            <a href="index.html" title="FreeZip-Tools Home" class="group flex flex-col items-center">
              <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-red-600 to-rose-500 text-white flex items-center justify-center shadow-lg shadow-red-500/25 ring-4 ring-red-500/10 dark:ring-red-500/20 group-hover:scale-105 group-hover:rotate-3 transition-transform duration-200">
                <i class="fa-solid fa-shapes text-2xl"></i>
              </div>
            </a>
            <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-red-50 dark:bg-red-950/50 border border-red-200/70 dark:border-red-900/50 text-[11px] font-mono font-bold text-red-600 dark:text-red-400">
              <i class="fa-solid fa-shapes text-[10px]"></i>
              <span>FREE<span class="text-red-500">ZIP-TOOLS</span></span>
            </div>
          </div>

          <!-- Title & Live Status -->
          <div class="space-y-1">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">
              Sign PDF
            </h1>
            <p id="statusText" class="text-xs font-mono text-slate-500 dark:text-slate-400 break-words">
              No PDF file selected
            </p>
          </div>

          <!-- Hidden File Input -->
          <input 
            type="file" 
            id="pdfInput" 
            accept=".pdf,application/pdf" 
            class="hidden" 
            onchange="handlePdfUpload(event)"
          >

          <!-- 1. MAIN BUTTON: UPLOAD PDF (Fixed Brand Red #E11D48, 54px Mobile Thumb Size) -->
          <div>
            <button 
              type="button"
              onclick="document.getElementById('pdfInput').click()"
              class="w-full min-h-[54px] py-3.5 px-5 rounded-xl bg-[#E11D48] hover:bg-rose-700 active:scale-[0.98] text-white font-bold text-base shadow-md shadow-rose-500/25 flex items-center justify-center gap-2.5 transition-all cursor-pointer"
            >
              <i class="fa-solid fa-signature text-lg"></i>
              <span>Upload PDF</span>
            </button>
          </div>

          <!-- Minimalist Signature Pad Box (Appears after file upload) -->
          <div id="signatureSection" class="hidden border border-slate-200 dark:border-slate-800 rounded-xl bg-white/70 dark:bg-slate-900/60 p-3.5 text-left space-y-3">
            <div class="flex items-center justify-between text-xs">
              <span class="font-bold text-slate-800 dark:text-slate-200 flex items-center gap-1.5">
                <i class="fa-solid fa-pen-nib text-red-500 text-[11px]"></i>
                <span>Draw Your Signature:</span>
              </span>
              <!-- Quick Ink Colors & Clear -->
              <div class="flex items-center gap-2">
                <div class="flex items-center gap-1">
                  <button type="button" onclick="setInkColor('#0f172a')" title="Black Ink" class="w-4 h-4 rounded-full bg-slate-900 border-2 border-white ring-1 ring-slate-400 focus:outline-none"></button>
                  <button type="button" onclick="setInkColor('#1d4ed8')" title="Blue Ink" class="w-4 h-4 rounded-full bg-blue-700 border-2 border-white ring-1 ring-slate-400 focus:outline-none"></button>
                  <button type="button" onclick="setInkColor('#dc2626')" title="Red Ink" class="w-4 h-4 rounded-full bg-red-600 border-2 border-white ring-1 ring-slate-400 focus:outline-none"></button>
                </div>
                <button 
                  type="button" 
                  onclick="clearSignaturePad()" 
                  class="text-[10px] font-mono font-semibold text-red-500 hover:text-red-700 dark:hover:text-red-400 pl-1"
                >
                  Clear
                </button>
              </div>
            </div>

            <!-- Signature Drawing Canvas -->
            <div class="relative w-full h-32 rounded-xl bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 overflow-hidden shadow-inner">
              <canvas id="signaturePad" class="w-full h-full cursor-crosshair"></canvas>
              <div id="padPlaceholder" class="pointer-events-none absolute inset-0 flex items-center justify-center text-xs font-mono text-slate-400 dark:text-slate-600">
                Sign here with finger or mouse
              </div>
            </div>

            <!-- Page Selection Options -->
            <div class="grid grid-cols-2 gap-2 text-xs pt-0.5">
              <div>
                <label for="pageTargetSelect" class="text-[11px] font-semibold text-slate-600 dark:text-slate-400 block mb-1">
                  Sign Page:
                </label>
                <select 
                  id="pageTargetSelect" 
                  class="w-full px-2.5 py-1.5 text-xs rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-200 focus:outline-none focus:border-red-500"
                >
                  <option value="last">Last Page</option>
                  <option value="first">First Page</option>
                  <option value="all">All Pages</option>
                </select>
              </div>
              <div>
                <label for="positionSelect" class="text-[11px] font-semibold text-slate-600 dark:text-slate-400 block mb-1">
                  Position:
                </label>
                <select 
                  id="positionSelect" 
                  class="w-full px-2.5 py-1.5 text-xs rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-200 focus:outline-none focus:border-red-500"
                >
                  <option value="bottom-right">Bottom Right</option>
                  <option value="bottom-left">Bottom Left</option>
                  <option value="bottom-center">Bottom Center</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Minimalist File Info Display -->
          <div id="fileInfoBox" class="hidden border-t border-b border-slate-200 dark:border-slate-800 py-3 text-left space-y-2">
            <div class="flex items-center justify-between text-xs px-3 py-2 rounded-lg bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800">
              <span id="fileNameDisplay" class="truncate font-medium text-slate-700 dark:text-slate-200 pr-2">document.pdf</span>
              <span id="filePagesDisplay" class="font-mono text-[11px] text-slate-400 shrink-0 font-bold">0p</span>
            </div>

            <!-- Signing Progress Bar -->
            <div id="conversionProgressBarBox" class="hidden space-y-1">
              <div class="flex items-center justify-between text-[11px] font-mono text-slate-500 dark:text-slate-400">
                <span id="conversionProgressLabel">Embedding signature...</span>
                <span id="conversionProgressPercent">0%</span>
              </div>
              <div class="w-full h-1.5 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden">
                <div id="conversionProgressBar" class="h-full bg-red-500 transition-all duration-150 w-0"></div>
              </div>
            </div>
          </div>

          <!-- 2 & 3. ACTION BUTTONS: DOWNLOAD & RESET (2-Column Thumb Grid) -->
          <div class="grid grid-cols-2 gap-2.5 sm:gap-3 pt-1">
            <button 
              id="downloadBtn"
              type="button"
              onclick="signAndDownload()"
              disabled
              class="w-full min-h-[48px] py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] disabled:bg-slate-200 dark:disabled:bg-slate-800 disabled:text-slate-400 disabled:cursor-not-allowed text-white font-bold text-sm flex items-center justify-center gap-2 transition-all"
            >
              <i class="fa-solid fa-download text-xs"></i>
              <span id="downloadBtnText">Download</span>
            </button>

            <button 
              id="resetBtn"
              type="button"
              onclick="resetAll()"
              disabled
              class="w-full min-h-[48px] py-3 px-4 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-[0.98] disabled:opacity-40 disabled:cursor-not-allowed text-slate-700 dark:text-slate-200 font-bold text-sm flex items-center justify-center gap-2 transition-all"
            >
              <i class="fa-solid fa-rotate-left text-xs"></i>
              <span>Reset</span>
            </button>
          </div>

        </div>
      </main>

      <!-- MOBILE SAFE-AREA FOOTER -->
      <footer class="safe-bottom border-t border-slate-200 dark:border-slate-800 px-4 pt-3 text-center text-[11px] font-mono text-slate-400">
        FreeZip-Tools &bull; 100% Sign PDF
      </footer>

    </div>
  </div>

  <!-- SIGN PDF JAVASCRIPT LOGIC -->
  <script>
    let uploadedFile = null;
    let pdfDoc = null;
    let totalPages = 0;

    // Canvas drawing states
    const canvas = document.getElementById('signaturePad');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let hasSignature = false;
    let currentInkColor = '#0f172a';

    // Retina-ready canvas sizing
    function setupCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      ctx.strokeStyle = currentInkColor;
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    }

    function setInkColor(color) {
      currentInkColor = color;
      ctx.strokeStyle = color;
    }

    function clearSignaturePad() {
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      hasSignature = false;
      document.getElementById('padPlaceholder').classList.remove('hidden');
      updateDownloadState();
    }

    function updateDownloadState() {
      const downloadBtn = document.getElementById('downloadBtn');
      downloadBtn.disabled = !(uploadedFile && hasSignature);
    }

    // Coordinate extraction for mouse/touch
    function getCanvasCoordinates(e) {
      const rect = canvas.getBoundingClientRect();
      let clientX, clientY;

      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }

      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    // Touch & Mouse Drawing Event Listeners
    function startDrawing(e) {
      e.preventDefault();
      isDrawing = true;
      hasSignature = true;
      document.getElementById('padPlaceholder').classList.add('hidden');
      const pos = getCanvasCoordinates(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
      updateDownloadState();
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getCanvasCoordinates(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDrawing(e) {
      if (!isDrawing) return;
      isDrawing = false;
      ctx.closePath();
      updateDownloadState();
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDrawing);

    canvas.addEventListener('touchstart', startDrawing, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    window.addEventListener('touchend', stopDrawing);

    // 1. Upload PDF Handler
    async function handlePdfUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const status = document.getElementById('statusText');
      status.innerText = 'Analyzing PDF file...';

      try {
        const buffer = await file.arrayBuffer();
        pdfDoc = await PDFLib.PDFDocument.load(buffer, { ignoreEncryption: true });
        totalPages = pdfDoc.getPageCount();

        uploadedFile = {
          name: file.name,
          buffer: buffer
        };

        document.getElementById('fileNameDisplay').innerText = file.name;
        document.getElementById('filePagesDisplay').innerText = `${totalPages} page(s)`;
        document.getElementById('signatureSection').classList.remove('hidden');
        document.getElementById('fileInfoBox').classList.remove('hidden');
        document.getElementById('conversionProgressBarBox').classList.add('hidden');

        // Setup drawing canvas once visible
        setTimeout(() => {
          setupCanvas();
        }, 50);

        status.innerText = `Draw signature below to sign (${totalPages} pages)`;
        document.getElementById('resetBtn').disabled = false;
        updateDownloadState();
      } catch (err) {
        console.error(err);
        status.innerText = 'Invalid or encrypted PDF file.';
      }

      event.target.value = '';
    }

    // 2. Embed Signature & Download PDF
    async function signAndDownload() {
      if (!pdfDoc || !uploadedFile || !hasSignature) return;

      const downloadBtn = document.getElementById('downloadBtn');
      const btnText = document.getElementById('downloadBtnText');
      const status = document.getElementById('statusText');
      const progressBox = document.getElementById('conversionProgressBarBox');
      const progressBar = document.getElementById('conversionProgressBar');
      const progressLabel = document.getElementById('conversionProgressLabel');
      const progressPercent = document.getElementById('conversionProgressPercent');

      try {
        downloadBtn.disabled = true;
        btnText.innerText = 'Signing...';
        progressBox.classList.remove('hidden');

        progressBar.style.width = '30%';
        progressPercent.innerText = '30%';
        progressLabel.innerText = 'Processing signature...';
        status.innerText = 'Converting drawn signature to PNG...';

        // Export signature from canvas as clean transparent PNG
        const signaturePngDataUrl = canvas.toDataURL('image/png');
        const signatureImage = await pdfDoc.embedPng(signaturePngDataUrl);

        progressBar.style.width = '60%';
        progressPercent.innerText = '60%';
        progressLabel.innerText = 'Applying to PDF pages...';

        const pageTarget = document.getElementById('pageTargetSelect').value;
        const position = document.getElementById('positionSelect').value;

        // Determine which pages receive the signature
        const pagesToSign = [];
        if (pageTarget === 'first') {
          pagesToSign.push(0);
        } else if (pageTarget === 'last') {
          pagesToSign.push(totalPages - 1);
        } else {
          // 'all' pages
          for (let i = 0; i < totalPages; i++) pagesToSign.push(i);
        }

        // Standard signature dimensions in PDF points
        const sigWidth = 140;
        const sigHeight = (canvas.height / canvas.width) * sigWidth;
        const margin = 40;

        for (const pageIndex of pagesToSign) {
          const page = pdfDoc.getPage(pageIndex);
          const { width, height } = page.getSize();

          let x = width - sigWidth - margin; // default bottom-right
          let y = margin;

          if (position === 'bottom-left') {
            x = margin;
          } else if (position === 'bottom-center') {
            x = (width - sigWidth) / 2;
          }

          page.drawImage(signatureImage, {
            x: x,
            y: y,
            width: sigWidth,
            height: sigHeight
          });
        }

        progressBar.style.width = '90%';
        progressPercent.innerText = '90%';
        progressLabel.innerText = 'Finalizing document...';
        status.innerText = 'Saving signed PDF...';

        const signedBytes = await pdfDoc.save();
        const blob = new Blob([signedBytes], { type: 'application/pdf' });
        const url = URL.createObjectURL(blob);

        const baseName = uploadedFile.name.replace(/\.pdf$/i, '');
        const outputFilename = `${baseName}-signed.pdf`;

        const a = document.createElement('a');
        a.href = url;
        a.download = outputFilename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        progressBar.style.width = '100%';
        progressPercent.innerText = '100%';
        status.innerText = `Signed & Downloaded ${outputFilename}!`;
      } catch (err) {
        console.error(err);
        status.innerText = 'Error signing PDF.';
      } finally {
        downloadBtn.disabled = false;
        btnText.innerText = 'Download';
      }
    }

    // 3. Reset Handler
    function resetAll() {
      uploadedFile = null;
      pdfDoc = null;
      totalPages = 0;

      clearSignaturePad();
      document.getElementById('statusText').innerText = 'No PDF file selected';
      document.getElementById('signatureSection').classList.add('hidden');
      document.getElementById('fileInfoBox').classList.add('hidden');
      document.getElementById('conversionProgressBarBox').classList.add('hidden');
      document.getElementById('conversionProgressBar').style.width = '0%';
      document.getElementById('downloadBtn').disabled = true;
      document.getElementById('resetBtn').disabled = true;
    }

    // Minimal Theme Switcher (Syncs with localStorage)
    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      const icon = document.getElementById('themeIcon');
      icon.className = isDark ? 'fa-solid fa-sun text-xs text-amber-400' : 'fa-solid fa-moon text-xs';
      localStorage.setItem('freezip_theme', isDark ? 'dark' : 'light');
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('freezip_theme') === 'dark') {
        document.documentElement.classList.add('dark');
        document.getElementById('themeIcon').className = 'fa-solid fa-sun text-xs text-amber-400';
      }
    });

    window.addEventListener('resize', () => {
      if (!document.getElementById('signatureSection').classList.contains('hidden')) {
        setupCanvas();
      }
    });
  </script>
</body>
</html>
