<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>PDF to Image — FreeZip-Tools (Minimalist)</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- PDF.js for Client-Side Canvas Rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- JSZip for Multi-Page Image ZIP Packaging -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    html, body {
      overscroll-behavior-y: none;
    }
    .wireframe-container {
      border-left: none;
      border-right: none;
    }
    @media (min-width: 640px) {
      .wireframe-container {
        border-left: 1.5px solid rgba(203, 213, 225, 0.8);
        border-right: 1.5px solid rgba(203, 213, 225, 0.8);
      }
      .dark .wireframe-container {
        border-left: 1.5px solid rgba(51, 65, 85, 0.7);
        border-right: 1.5px solid rgba(51, 65, 85, 0.7);
      }
    }
    .safe-bottom {
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
    }
  </style>
</head>

<body class="bg-white sm:bg-slate-100/70 dark:bg-[#0D131F] sm:dark:bg-[#070b12] text-slate-800 dark:text-slate-100 min-h-[100dvh] font-sans transition-colors duration-200 antialiased flex flex-col overflow-x-hidden select-none">

  <!-- MOBILE-FIRST OUTER WRAPPER -->
  <div class="w-full max-w-[1140px] mx-auto px-0 sm:px-6 md:px-10 flex-1 flex flex-col">

    <!-- MINIMAL WIREFRAME CONTAINER -->
    <div class="wireframe-container bg-white dark:bg-[#0D131F] flex-1 flex flex-col justify-between sm:shadow-sm">

      <!-- MOBILE-FIRST HEADER -->
      <header class="border-b border-slate-200 dark:border-slate-800 px-4 sm:px-6 md:px-8 h-14 sm:h-16 flex items-center justify-between gap-2 sticky top-0 z-30 bg-white/95 dark:bg-[#0D131F]/95 backdrop-blur-md">
        <a href="index.html" class="flex items-center gap-2.5 font-bold tracking-tight text-slate-900 dark:text-white group">
          <span class="w-8 h-8 rounded-lg bg-red-500 text-white flex items-center justify-center text-xs shadow-sm shadow-red-500/40 group-hover:rotate-6 transition-transform">
            <i class="fa-solid fa-shapes"></i>
          </span>
          <span class="text-base font-extrabold uppercase tracking-wide">
            Free<span class="text-red-500">Zip-Tools</span>
          </span>
        </a>

        <div class="flex items-center gap-2 shrink-0">
          <a href="index.html" class="h-10 px-3 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-300 bg-slate-100/80 dark:bg-slate-800/60 hover:text-red-500 active:scale-95 transition-all flex items-center gap-1.5">
            <i class="fa-solid fa-arrow-left text-[11px]"></i>
            <span>Home</span>
          </a>
          <button onclick="toggleTheme()" aria-label="Toggle Theme" class="w-10 h-10 rounded-xl border border-slate-200 dark:border-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300 active:scale-95 transition-all">
            <i id="themeIcon" class="fa-solid fa-moon text-sm"></i>
          </button>
        </div>
      </header>

      <!-- MOBILE-FIRST MAIN WORKSPACE -->
      <main class="flex-1 flex flex-col justify-center px-4 py-5 sm:p-8 md:p-12 w-full">
        <div class="w-full max-w-md mx-auto border border-slate-200/90 dark:border-slate-800 rounded-2xl bg-slate-50/70 dark:bg-[#111827]/80 p-5 sm:p-7 text-center space-y-5 shadow-sm">

          <!-- Website Logo & Brand Identity Badge -->
          <div class="flex flex-col items-center justify-center gap-2 pt-1">
            <a href="index.html" title="FreeZip-Tools Home" class="group flex flex-col items-center">
              <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-red-600 to-rose-500 text-white flex items-center justify-center shadow-lg shadow-red-500/25 ring-4 ring-red-500/10 dark:ring-red-500/20 group-hover:scale-105 group-hover:rotate-3 transition-transform duration-200">
                <i class="fa-solid fa-shapes text-2xl"></i>
              </div>
            </a>
            <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-red-50 dark:bg-red-950/50 border border-red-200/70 dark:border-red-900/50 text-[11px] font-mono font-bold text-red-600 dark:text-red-400">
              <i class="fa-solid fa-shapes text-[10px]"></i>
              <span>FREE<span class="text-red-500">ZIP-TOOLS</span></span>
            </div>
          </div>

          <!-- Title & Live Status -->
          <div class="space-y-1">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">
              PDF to Image
            </h1>
            <p id="statusText" class="text-xs font-mono text-slate-500 dark:text-slate-400 break-words">
              No PDF file selected
            </p>
          </div>

          <!-- Output Image Format Pill Selector (JPG / PNG) -->
          <div class="border border-slate-200 dark:border-slate-800 rounded-xl bg-white/70 dark:bg-slate-900/60 p-2.5 flex items-center justify-between text-xs">
            <span class="font-bold text-slate-700 dark:text-slate-300 flex items-center gap-1.5 pl-1">
              <i class="fa-solid fa-image text-red-500 text-[11px]"></i>
              <span>Format:</span>
            </span>
            <div class="grid grid-cols-2 gap-1.5 font-mono text-[11px] font-bold">
              <button 
                type="button" 
                id="formatJpgBtn"
                onclick="setFormat('jpeg')" 
                class="px-3 py-1 rounded-lg bg-[#E11D48] text-white shadow-sm transition-all"
              >
                JPG
              </button>
              <button 
                type="button" 
                id="formatPngBtn"
                onclick="setFormat('png')" 
                class="px-3 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-red-50 dark:hover:bg-red-950/40 transition-all"
              >
                PNG
              </button>
            </div>
          </div>

          <!-- Hidden File Input -->
          <input 
            type="file" 
            id="pdfInput" 
            accept=".pdf,application/pdf" 
            class="hidden" 
            onchange="handlePdfUpload(event)"
          >

          <!-- 1. MAIN BUTTON: UPLOAD PDF (54px Mobile Thumb Size) -->
          <div>
            <button 
              type="button"
              onclick="document.getElementById('pdfInput').click()"
              class="w-full min-h-[54px] py-3.5 px-5 rounded-xl bg-[#E11D48] hover:bg-rose-700 active:scale-[0.98] text-white font-bold text-base shadow-md shadow-rose-500/25 flex items-center justify-center gap-2.5 transition-all cursor-pointer"
            >
              <i class="fa-solid fa-file-image text-lg"></i>
              <span>Upload PDF</span>
            </button>
          </div>

          <!-- Minimalist File Info Display -->
          <div id="fileInfoBox" class="hidden border-t border-b border-slate-200 dark:border-slate-800 py-3 text-left space-y-2">
            <div class="flex items-center justify-between text-xs px-3 py-2 rounded-lg bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800">
              <span id="fileNameDisplay" class="truncate font-medium text-slate-700 dark:text-slate-200 pr-2">document.pdf</span>
              <span id="filePagesDisplay" class="font-mono text-[11px] text-slate-400 shrink-0 font-bold">0p</span>
            </div>

            <!-- Conversion Progress Bar (shown during processing) -->
            <div id="conversionProgressBarBox" class="hidden space-y-1">
              <div class="flex items-center justify-between text-[11px] font-mono text-slate-500 dark:text-slate-400">
                <span id="conversionProgressLabel">Rendering...</span>
                <span id="conversionProgressPercent">0%</span>
              </div>
              <div class="w-full h-1.5 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden">
                <div id="conversionProgressBar" class="h-full bg-red-500 transition-all duration-150 w-0"></div>
              </div>
            </div>
          </div>

          <!-- 2 & 3. ACTION BUTTONS: DOWNLOAD & RESET (2-Column Thumb Grid) -->
          <div class="grid grid-cols-2 gap-2.5 sm:gap-3 pt-1">
            <button 
              id="downloadBtn"
              type="button"
              onclick="convertToImagesAndDownload()"
              disabled
              class="w-full min-h-[48px] py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] disabled:bg-slate-200 dark:disabled:bg-slate-800 disabled:text-slate-400 disabled:cursor-not-allowed text-white font-bold text-sm flex items-center justify-center gap-2 transition-all"
            >
              <i class="fa-solid fa-download text-xs"></i>
              <span id="downloadBtnText">Download</span>
            </button>

            <button 
              id="resetBtn"
              type="button"
              onclick="resetAll()"
              disabled
              class="w-full min-h-[48px] py-3 px-4 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-[0.98] disabled:opacity-40 disabled:cursor-not-allowed text-slate-700 dark:text-slate-200 font-bold text-sm flex items-center justify-center gap-2 transition-all"
            >
              <i class="fa-solid fa-rotate-left text-xs"></i>
              <span>Reset</span>
            </button>
          </div>

        </div>
      </main>

      <!-- MOBILE SAFE-AREA FOOTER -->
      <footer class="safe-bottom border-t border-slate-200 dark:border-slate-800 px-4 pt-3 text-center text-[11px] font-mono text-slate-400">
        FreeZip-Tools &bull; 100% Client-Side PDF to Image
      </footer>

    </div>
  </div>

  <!-- PDF TO IMAGE JAVASCRIPT LOGIC -->
  <script>
    // Worker initialization with in-memory Blob to prevent CORS blockage
    if (window.pdfjsLib) {
      try {
        const workerBlob = new Blob(
          [`importScripts('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js');`],
          { type: 'application/javascript' }
        );
        pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(workerBlob);
      } catch (e) {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }
    }

    let uploadedFile = null;
    let pdfDoc = null;
    let totalPages = 0;
    let selectedFormat = 'jpeg'; // 'jpeg' or 'png'

    // Format selection toggle
    function setFormat(fmt) {
      selectedFormat = fmt;
      const jpgBtn = document.getElementById('formatJpgBtn');
      const pngBtn = document.getElementById('formatPngBtn');

      if (fmt === 'jpeg') {
        jpgBtn.className = 'px-3 py-1 rounded-lg bg-[#E11D48] text-white font-bold shadow-sm transition-all';
        pngBtn.className = 'px-3 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-red-50 dark:hover:bg-red-950/40 transition-all';
      } else {
        pngBtn.className = 'px-3 py-1 rounded-lg bg-[#E11D48] text-white font-bold shadow-sm transition-all';
        jpgBtn.className = 'px-3 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-red-50 dark:hover:bg-red-950/40 transition-all';
      }
    }

    // 1. Upload PDF Handler
    async function handlePdfUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const status = document.getElementById('statusText');
      status.innerText = 'Reading PDF file...';

      try {
        const buffer = await file.arrayBuffer();
        const loadingTask = pdfjsLib.getDocument({
          data: new Uint8Array(buffer),
          disableFontFace: true
        });
        pdfDoc = await loadingTask.promise;
        totalPages = pdfDoc.numPages;

        uploadedFile = {
          name: file.name,
          buffer: buffer
        };

        document.getElementById('fileNameDisplay').innerText = file.name;
        document.getElementById('filePagesDisplay').innerText = `${totalPages} page(s)`;
        document.getElementById('fileInfoBox').classList.remove('hidden');
        document.getElementById('conversionProgressBarBox').classList.add('hidden');

        status.innerText = `Ready • ${totalPages} page(s) found`;

        document.getElementById('downloadBtn').disabled = false;
        document.getElementById('resetBtn').disabled = false;
      } catch (err) {
        console.error(err);
        status.innerText = 'Invalid or encrypted PDF file.';
      }

      event.target.value = '';
    }

    // 2. Convert to Images & Download
    async function convertToImagesAndDownload() {
      if (!pdfDoc || !uploadedFile) return;

      const downloadBtn = document.getElementById('downloadBtn');
      const btnText = document.getElementById('downloadBtnText');
      const status = document.getElementById('statusText');
      const progressBox = document.getElementById('conversionProgressBarBox');
      const progressBar = document.getElementById('conversionProgressBar');
      const progressLabel = document.getElementById('conversionProgressLabel');
      const progressPercent = document.getElementById('conversionProgressPercent');

      try {
        downloadBtn.disabled = true;
        btnText.innerText = 'Converting...';
        progressBox.classList.remove('hidden');

        const baseName = uploadedFile.name.replace(/\.pdf$/i, '');
        const ext = selectedFormat === 'jpeg' ? 'jpg' : 'png';
        const mime = selectedFormat === 'jpeg' ? 'image/jpeg' : 'image/png';
        const quality = selectedFormat === 'jpeg' ? 0.92 : undefined;

        // CASE A: Single-Page PDF -> Download directly as single image
        if (totalPages === 1) {
          status.innerText = 'Rendering page 1...';
          progressBar.style.width = '70%';
          progressLabel.innerText = 'Rendering page 1 of 1...';
          progressPercent.innerText = '70%';

          const page = await pdfDoc.getPage(1);
          const viewport = page.getViewport({ scale: 2.0 }); // High-DPI 2x crisp scale
          const canvas = document.createElement('canvas');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          const ctx = canvas.getContext('2d');

          // White background for JPEG
          if (selectedFormat === 'jpeg') {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
          }

          await page.render({ canvasContext: ctx, viewport: viewport }).promise;

          canvas.toBlob((blob) => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${baseName}.${ext}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            progressBar.style.width = '100%';
            progressPercent.innerText = '100%';
            status.innerText = `Downloaded ${baseName}.${ext}!`;
          }, mime, quality);
        }
        // CASE B: Multi-Page PDF -> Convert each page and package into a ZIP
        else {
          const zip = new JSZip();

          for (let i = 1; i <= totalPages; i++) {
            const currentPct = Math.round(((i - 1) / totalPages) * 100);
            progressBar.style.width = `${currentPct}%`;
            progressLabel.innerText = `Rendering page ${i} of ${totalPages}...`;
            progressPercent.innerText = `${currentPct}%`;
            status.innerText = `Converting page ${i} of ${totalPages}...`;

            const page = await pdfDoc.getPage(i);
            const viewport = page.getViewport({ scale: 2.0 });
            const canvas = document.createElement('canvas');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            const ctx = canvas.getContext('2d');

            if (selectedFormat === 'jpeg') {
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            await page.render({ canvasContext: ctx, viewport: viewport }).promise;

            const blob = await new Promise(resolve => canvas.toBlob(resolve, mime, quality));
            const arrayBuf = await blob.arrayBuffer();
            zip.file(`${baseName}-page-${i}.${ext}`, arrayBuf);
          }

          status.innerText = 'Archiving images to ZIP...';
          progressLabel.innerText = 'Packaging ZIP...';
          progressBar.style.width = '95%';
          progressPercent.innerText = '95%';

          const zipBlob = await zip.generateAsync({ type: 'blob' });
          const url = URL.createObjectURL(zipBlob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `${baseName}-images.zip`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);

          progressBar.style.width = '100%';
          progressPercent.innerText = '100%';
          status.innerText = `All ${totalPages} pages saved as ${baseName}-images.zip!`;
        }
      } catch (err) {
        console.error(err);
        status.innerText = 'Error converting PDF to images.';
      } finally {
        downloadBtn.disabled = false;
        btnText.innerText = 'Download';
      }
    }

    // 3. Reset Handler
    function resetAll() {
      uploadedFile = null;
      pdfDoc = null;
      totalPages = 0;

      document.getElementById('statusText').innerText = 'No PDF file selected';
      document.getElementById('fileInfoBox').classList.add('hidden');
      document.getElementById('conversionProgressBarBox').classList.add('hidden');
      document.getElementById('conversionProgressBar').style.width = '0%';
      document.getElementById('downloadBtn').disabled = true;
      document.getElementById('resetBtn').disabled = true;
      setFormat('jpeg');
    }

    // Minimal Theme Switcher (Syncs with localStorage)
    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      const icon = document.getElementById('themeIcon');
      icon.className = isDark ? 'fa-solid fa-sun text-xs text-amber-400' : 'fa-solid fa-moon text-xs';
      localStorage.setItem('freezip_theme', isDark ? 'dark' : 'light');
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('freezip_theme') === 'dark') {
        document.documentElement.classList.add('dark');
        document.getElementById('themeIcon').className = 'fa-solid fa-sun text-xs text-amber-400';
      }
    });
  </script>
</body>
</html>
