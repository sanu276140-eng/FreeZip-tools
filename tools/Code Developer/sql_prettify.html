<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>SQL Prettify — FreeZip</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    html, body {
      overscroll-behavior-y: none;
    }
    .wireframe-container {
      border-left: none;
      border-right: none;
    }
    @media (min-width: 640px) {
      .wireframe-container {
        border-left: 1.5px solid rgba(203, 213, 225, 0.8);
        border-right: 1.5px solid rgba(203, 213, 225, 0.8);
      }
      .dark .wireframe-container {
        border-left: 1.5px solid rgba(51, 65, 85, 0.7);
        border-right: 1.5px solid rgba(51, 65, 85, 0.7);
      }
    }
    .safe-bottom {
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
    }
    /* Custom code editor styling */
    textarea {
      tab-size: 2;
    }
  </style>
</head>

<body class="bg-white sm:bg-slate-100/70 dark:bg-[#0D131F] sm:dark:bg-[#070b12] text-slate-800 dark:text-slate-100 min-h-[100dvh] font-sans transition-colors duration-200 antialiased flex flex-col overflow-x-hidden select-none">

  <!-- MOBILE-FIRST OUTER WRAPPER -->
  <div class="w-full max-w-[1140px] mx-auto px-0 sm:px-6 md:px-10 flex-1 flex flex-col">

    <!-- MINIMAL WIREFRAME CONTAINER -->
    <div class="wireframe-container bg-white dark:bg-[#0D131F] flex-1 flex flex-col justify-between sm:shadow-sm">

      <!-- MOBILE-FIRST HEADER -->
      <header class="border-b border-slate-200 dark:border-slate-800 px-4 sm:px-6 md:px-8 h-14 sm:h-16 flex items-center justify-between gap-2 sticky top-0 z-30 bg-white/95 dark:bg-[#0D131F]/95 backdrop-blur-md">
        <a href="https://www.freezip.site/" class="flex items-center gap-2.5 font-bold tracking-tight text-slate-900 dark:text-white group">
          <span class="w-8 h-8 rounded-lg bg-red-500 text-white flex items-center justify-center text-xs shadow-sm shadow-red-500/40 group-hover:rotate-6 transition-transform">
            <i class="fa-solid fa-shapes"></i>
          </span>
          <span class="text-base font-extrabold uppercase tracking-wide">
            Free<span class="text-red-500">Zip-Tools</span>
          </span>
        </a>

        <div class="flex items-center gap-2 shrink-0">
          <a href="https://www.freezip.site/" class="h-10 px-3 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-300 bg-slate-100/80 dark:bg-slate-800/60 hover:text-red-500 active:scale-95 transition-all flex items-center gap-1.5">
            <i class="fa-solid fa-arrow-left text-[11px]"></i>
            <span>Home</span>
          </a>
          <button onclick="toggleTheme()" aria-label="Toggle Theme" class="w-10 h-10 rounded-xl border border-slate-200 dark:border-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300 active:scale-95 transition-all">
            <i id="themeIcon" class="fa-solid fa-moon text-sm"></i>
          </button>
        </div>
      </header>

      <!-- MOBILE-FIRST MAIN WORKSPACE -->
      <main class="flex-1 flex flex-col justify-center px-4 py-5 sm:p-8 md:p-12 w-full">
        <div class="w-full max-w-md mx-auto border border-slate-200/90 dark:border-slate-800 rounded-2xl bg-slate-50/70 dark:bg-[#111827]/80 p-5 sm:p-7 text-center space-y-5 shadow-sm">

          <!-- Website Logo & Brand Identity Badge -->
          <div class="flex flex-col items-center justify-center gap-2 pt-1">
            <a href="index.html" title="FreeZip-Tools Home" class="group flex flex-col items-center">
              <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-red-600 to-rose-500 text-white flex items-center justify-center shadow-lg shadow-red-500/25 ring-4 ring-red-500/10 dark:ring-red-500/20 group-hover:scale-105 group-hover:rotate-3 transition-transform duration-200">
                <i class="fa-solid fa-shapes text-2xl"></i>
              </div>
            </a>
            <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-red-50 dark:bg-red-950/50 border border-red-200/70 dark:border-red-900/50 text-[11px] font-mono font-bold text-red-600 dark:text-red-400">
              <i class="fa-solid fa-shapes text-[10px]"></i>
              <span>FREE<span class="text-red-500">ZIP-TOOLS</span></span>
            </div>
          </div>

          <!-- Title & Live Status -->
          <div class="space-y-1">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">
              SQL Prettify
            </h1>
            <p id="statusText" class="text-xs font-mono text-slate-500 dark:text-slate-400 break-words">
              Upload SQL file or paste query below
            </p>
          </div>

          <!-- Hidden File Input -->
          <input 
            type="file" 
            id="sqlFileInput" 
            accept=".sql,.txt,text/plain" 
            class="hidden" 
            onchange="handleSqlUpload(event)"
          >

          <!-- 1. MAIN BUTTON: UPLOAD SQL (Fixed Brand Red #E11D48, 54px Mobile Thumb Size) -->
          <div>
            <button 
              type="button"
              onclick="document.getElementById('sqlFileInput').click()"
              class="w-full min-h-[54px] py-3.5 px-5 rounded-xl bg-[#E11D48] hover:bg-rose-700 active:scale-[0.98] text-white font-bold text-base shadow-md shadow-rose-500/25 flex items-center justify-center gap-2.5 transition-all cursor-pointer"
            >
              <i class="fa-solid fa-database text-lg"></i>
              <span>Upload SQL</span>
            </button>
          </div>

          <!-- Minimalist SQL Editor & Controls Area -->
          <div class="border border-slate-200 dark:border-slate-800 rounded-xl bg-white/70 dark:bg-slate-900/60 p-3 text-left space-y-2.5">
            <!-- Indent Pill Selector & Helpers -->
            <div class="flex items-center justify-between text-xs flex-wrap gap-1">
              <div class="flex items-center gap-1 font-mono text-[11px]">
                <button type="button" onclick="setIndent(2)" id="indent2Btn" class="px-2 py-0.5 rounded font-bold bg-[#E11D48] text-white transition-all">2 Spaces</button>
                <button type="button" onclick="setIndent(4)" id="indent4Btn" class="px-2 py-0.5 rounded font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-all">4 Spaces</button>
                <button type="button" onclick="setIndent(0)" id="indentMinBtn" class="px-2 py-0.5 rounded font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-all">Minify</button>
                <button type="button" onclick="toggleUppercase()" id="upperToggleBtn" class="px-2 py-0.5 rounded font-semibold bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 transition-all" title="Toggle Uppercase Keywords">UPPER</button>
              </div>

              <!-- Quick Sample & Copy Helper -->
              <div class="flex items-center gap-2">
                <button type="button" onclick="loadSampleSql()" class="text-[10px] font-mono font-semibold text-red-500 hover:text-red-700 dark:hover:text-red-400">
                  Sample
                </button>
                <button type="button" onclick="copyFormattedSql()" id="copyBtn" class="text-[10px] font-mono font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 flex items-center gap-1">
                  <i class="fa-regular fa-copy text-[10px]"></i>
                  <span id="copyBtnText">Copy</span>
                </button>
              </div>
            </div>

            <!-- Editor Input -->
            <div class="relative">
              <textarea 
                id="sqlEditor"
                rows="7"
                oninput="handleEditorInput(this.value)"
                placeholder="Paste raw SQL query here or click 'Upload SQL'..."
                class="w-full p-2.5 text-xs font-mono rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-slate-800 dark:text-slate-200 placeholder-slate-400 focus:outline-none focus:border-red-500 transition-colors resize-y leading-relaxed"
                spellcheck="false"
              ></textarea>
            </div>

            <!-- Live Status & Counters -->
            <div class="flex items-center justify-between text-[11px] font-mono">
              <span id="validationBadge" class="text-slate-400">Waiting for SQL input...</span>
              <span id="counterDisplay" class="text-slate-400 font-semibold">0 chars</span>
            </div>
          </div>

          <!-- 2 & 3. ACTION BUTTONS: DOWNLOAD & RESET (2-Column Thumb Grid) -->
          <div class="grid grid-cols-2 gap-2.5 sm:gap-3 pt-1">
            <button 
              id="downloadBtn"
              type="button"
              onclick="downloadSqlFile()"
              disabled
              class="w-full min-h-[48px] py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] disabled:bg-slate-200 dark:disabled:bg-slate-800 disabled:text-slate-400 disabled:cursor-not-allowed text-white font-bold text-sm flex items-center justify-center gap-2 transition-all"
            >
              <i class="fa-solid fa-download text-xs"></i>
              <span id="downloadBtnText">Download</span>
            </button>

            <button 
              id="resetBtn"
              type="button"
              onclick="resetAll()"
              disabled
              class="w-full min-h-[48px] py-3 px-4 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-[0.98] disabled:opacity-40 disabled:cursor-not-allowed text-slate-700 dark:text-slate-200 font-bold text-sm flex items-center justify-center gap-2 transition-all"
            >
              <i class="fa-solid fa-rotate-left text-xs"></i>
              <span>Reset</span>
            </button>
          </div>

        </div>
      </main>

      <!-- MOBILE SAFE-AREA FOOTER -->
      <footer class="safe-bottom border-t border-slate-200 dark:border-slate-800 px-4 pt-3 text-center text-[11px] font-mono text-slate-400">
        FreeZip-Tools &bull; 100% SQL Prettifier
      </footer>

    </div>
  </div>

  <!-- SQL PRETTIFY JAVASCRIPT LOGIC -->
  <script>
    let currentIndent = 2;
    let uppercaseKeywords = true;
    let rawQuery = '';
    let originalFileName = 'query.sql';

    // List of major SQL keywords
    const SQL_MAJOR_CLAUSES = [
      'SELECT', 'FROM', 'WHERE', 'AND', 'OR', 'LEFT JOIN', 'RIGHT JOIN', 
      'INNER JOIN', 'OUTER JOIN', 'CROSS JOIN', 'FULL JOIN', 'JOIN', 
      'ON', 'ORDER BY', 'GROUP BY', 'HAVING', 'LIMIT', 'OFFSET', 
      'INSERT INTO', 'VALUES', 'UPDATE', 'SET', 'DELETE FROM', 'DELETE',
      'UNION ALL', 'UNION', 'EXCEPT', 'INTERSECT', 'CASE', 'WHEN', 'THEN', 
      'ELSE', 'END', 'CREATE TABLE', 'ALTER TABLE', 'DROP TABLE'
    ];

    const SQL_ALL_KEYWORDS = [
      ...SQL_MAJOR_CLAUSES,
      'AS', 'DISTINCT', 'IN', 'NOT IN', 'BETWEEN', 'LIKE', 'ILIKE', 'IS NULL', 
      'IS NOT NULL', 'EXISTS', 'NOT EXISTS', 'ALL', 'ANY', 'ASC', 'DESC', 
      'PRIMARY KEY', 'FOREIGN KEY', 'REFERENCES', 'AUTO_INCREMENT', 'NOT NULL', 
      'DEFAULT', 'COUNT', 'SUM', 'AVG', 'MIN', 'MAX', 'INTO'
    ];

    // Indent selector (2 spaces, 4 spaces, or 0 / minified)
    function setIndent(spaces) {
      currentIndent = spaces;

      const btn2 = document.getElementById('indent2Btn');
      const btn4 = document.getElementById('indent4Btn');
      const btnMin = document.getElementById('indentMinBtn');

      [btn2, btn4, btnMin].forEach(b => {
        b.className = 'px-2 py-0.5 rounded font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-all';
      });

      if (spaces === 2) {
        btn2.className = 'px-2 py-0.5 rounded font-bold bg-[#E11D48] text-white transition-all';
      } else if (spaces === 4) {
        btn4.className = 'px-2 py-0.5 rounded font-bold bg-[#E11D48] text-white transition-all';
      } else {
        btnMin.className = 'px-2 py-0.5 rounded font-bold bg-[#E11D48] text-white transition-all';
      }

      if (rawQuery.trim()) {
        const formatted = formatSqlString(rawQuery);
        document.getElementById('sqlEditor').value = formatted;
        updateCounts(formatted);
      }
    }

    // Toggle Uppercase keywords
    function toggleUppercase() {
      uppercaseKeywords = !uppercaseKeywords;
      const btn = document.getElementById('upperToggleBtn');
      if (uppercaseKeywords) {
        btn.className = 'px-2 py-0.5 rounded font-semibold bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-slate-200 transition-all';
        btn.innerText = 'UPPER';
      } else {
        btn.className = 'px-2 py-0.5 rounded font-semibold text-slate-400 bg-transparent transition-all';
        btn.innerText = 'lower';
      }

      if (rawQuery.trim()) {
        const formatted = formatSqlString(rawQuery);
        document.getElementById('sqlEditor').value = formatted;
        updateCounts(formatted);
      }
    }

    // In-browser intelligent SQL formatting engine
    function formatSqlString(sql) {
      if (!sql.trim()) return '';

      // Case A: Minify mode (single-line compact)
      if (currentIndent === 0) {
        return sql
          .replace(/\/\*[\s\S]*?\*\/|--.*$/gm, '') // Remove comments
          .replace(/\s+/g, ' ')                   // Compress whitespaces
          .trim();
      }

      // Case B: Prettify with Indentation & Keyword formatting
      let clean = sql
        .replace(/\/\*[\s\S]*?\*\/|--.*$/gm, '') // Remove comments
        .replace(/\s+/g, ' ')                   // Single space everywhere
        .trim();

      // Normalize keywords case
      if (uppercaseKeywords) {
        // Sort keywords longest first to match compounds like "LEFT JOIN" before "JOIN"
        const sortedKeywords = [...SQL_ALL_KEYWORDS].sort((a, b) => b.length - a.length);
        for (const kw of sortedKeywords) {
          const regex = new RegExp(`\\b${kw}\\b`, 'gi');
          clean = clean.replace(regex, kw.toUpperCase());
        }
      }

      const indentStr = ' '.repeat(currentIndent);

      // Break onto newlines before major clauses
      const majorClauses = [
        'SELECT', 'FROM', 'WHERE', 'AND', 'OR', 'LEFT JOIN', 'RIGHT JOIN', 
        'INNER JOIN', 'OUTER JOIN', 'CROSS JOIN', 'FULL JOIN', 'JOIN', 
        'GROUP BY', 'ORDER BY', 'HAVING', 'LIMIT', 'OFFSET', 'VALUES', 
        'SET', 'UNION ALL', 'UNION'
      ];

      for (const clause of majorClauses) {
        const targetKw = uppercaseKeywords ? clause.toUpperCase() : clause;
        const clauseRegex = new RegExp(`\\s+(${targetKw})\\b`, 'gi');
        clean = clean.replace(clauseRegex, `\n$1`);
      }

      // Add sub-indentation for lines that aren't starting with top-level statements
      const lines = clean.split('\n');
      const topLevelKeywords = ['SELECT', 'FROM', 'WHERE', 'GROUP BY', 'ORDER BY', 'HAVING', 'LIMIT', 'OFFSET', 'UNION', 'INSERT INTO', 'UPDATE', 'DELETE FROM'];

      const formattedLines = lines.map(line => {
        line = line.trim();
        if (!line) return '';

        const startsWithTop = topLevelKeywords.some(k => line.toUpperCase().startsWith(k));
        if (startsWithTop) {
          return line;
        } else {
          return indentStr + line;
        }
      });

      return formattedLines.filter(l => l.length > 0).join('\n');
    }

    // Update counters and live UI state
    function updateCounts(text) {
      const counterDisplay = document.getElementById('counterDisplay');
      const lineCount = text.trim() ? text.split('\n').length : 0;
      counterDisplay.innerText = `${text.length} chars • ${lineCount} lines`;
    }

    // Live textarea input listener
    function handleEditorInput(val) {
      rawQuery = val;
      const status = document.getElementById('statusText');
      const validationBadge = document.getElementById('validationBadge');
      const downloadBtn = document.getElementById('downloadBtn');
      const resetBtn = document.getElementById('resetBtn');

      updateCounts(val);

      if (!val.trim()) {
        status.innerText = 'Upload SQL file or paste query below';
        validationBadge.innerText = 'Waiting for SQL input...';
        validationBadge.className = 'text-slate-400';
        downloadBtn.disabled = true;
        resetBtn.disabled = true;
        return;
      }

      resetBtn.disabled = false;
      downloadBtn.disabled = false;

      const hasSelect = /\b(SELECT|INSERT|UPDATE|DELETE|CREATE|ALTER|DROP)\b/i.test(val);
      if (hasSelect) {
        status.innerText = 'SQL query ready to format';
        validationBadge.innerHTML = '<span class="text-emerald-600 dark:text-emerald-400 font-bold"><i class="fa-solid fa-circle-check mr-1"></i>SQL Detected</span>';
      } else {
        status.innerText = 'Editing query...';
        validationBadge.innerText = 'Text input active';
      }
    }

    // 1. Upload SQL File Handler
    async function handleSqlUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const status = document.getElementById('statusText');
      status.innerText = 'Reading SQL file...';

      try {
        const text = await file.text();
        rawQuery = text;
        originalFileName = file.name.endsWith('.sql') ? file.name : `${file.name}.sql`;

        const formatted = formatSqlString(text);
        document.getElementById('sqlEditor').value = formatted;
        handleEditorInput(formatted);
        status.innerText = `Loaded ${file.name} successfully!`;
      } catch (err) {
        console.error(err);
        status.innerText = 'Could not read SQL file.';
      }

      event.target.value = '';
    }

    // Load sample SQL query
    function loadSampleSql() {
      const sample = `SELECT u.id, u.username, u.email, COUNT(o.id) AS total_orders, SUM(o.amount) AS total_spent FROM users u LEFT JOIN orders o ON u.id = o.user_id WHERE u.status = 'active' AND u.created_at >= '2025-01-01' GROUP BY u.id, u.username, u.email HAVING COUNT(o.id) > 5 ORDER BY total_spent DESC LIMIT 50;`;
      rawQuery = sample;
      originalFileName = 'sample_query.sql';
      const formatted = formatSqlString(sample);
      document.getElementById('sqlEditor').value = formatted;
      handleEditorInput(formatted);
    }

    // Copy to Clipboard (document.execCommand fallback for iframe support)
    function copyFormattedSql() {
      const editor = document.getElementById('sqlEditor');
      if (!editor.value.trim()) return;

      editor.select();
      editor.setSelectionRange(0, 99999);
      try {
        document.execCommand('copy');
        const copyBtnText = document.getElementById('copyBtnText');
        copyBtnText.innerText = 'Copied!';
        setTimeout(() => {
          copyBtnText.innerText = 'Copy';
        }, 1800);
      } catch (e) {
        console.error('Copy failed');
      }
    }

    // 2. Download Prettified SQL File
    function downloadSqlFile() {
      const editor = document.getElementById('sqlEditor');
      const content = editor.value;
      if (!content.trim()) return;

      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = originalFileName.replace(/\.sql$/i, '') + '-prettified.sql';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      document.getElementById('statusText').innerText = `Downloaded ${a.download}!`;
    }

    // 3. Reset Handler
    function resetAll() {
      rawQuery = '';
      originalFileName = 'query.sql';
      document.getElementById('sqlEditor').value = '';
      document.getElementById('statusText').innerText = 'Upload SQL file or paste query below';
      document.getElementById('validationBadge').innerText = 'Waiting for SQL input...';
      document.getElementById('validationBadge').className = 'text-slate-400';
      document.getElementById('counterDisplay').innerText = '0 chars';
      document.getElementById('downloadBtn').disabled = true;
      document.getElementById('resetBtn').disabled = true;
      setIndent(2);
    }

    // Minimal Theme Switcher (Syncs with localStorage)
    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      const icon = document.getElementById('themeIcon');
      icon.className = isDark ? 'fa-solid fa-sun text-xs text-amber-400' : 'fa-solid fa-moon text-xs';
      localStorage.setItem('freezip_theme', isDark ? 'dark' : 'light');
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('freezip_theme') === 'dark') {
        document.documentElement.classList.add('dark');
        document.getElementById('themeIcon').className = 'fa-solid fa-sun text-xs text-amber-400';
      }
    });
  </script>
</body>
</html>
