                spellcheck="false"

            <!-- Live Status & Stats -->

              <span id="validationBadge" class="text-slate-400">Waiting for cURL input...</span>

          <!-- 2 & 3. ACTION BUTTONS: DOWNLOAD & RESET (2-Column Thumb Grid) -->
          <div class="grid grid-cols-2 gap-2.5 sm:gap-3 pt-1">
            <button 
              id="downloadBtn"
              type="button"
              onclick="downloadResultFile()"
              disabled
              class="w-full min-h-[48px] py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] disabled:bg-slate-200 dark:disabled:bg-slate-800 disabled:text-slate-400 disabled:cursor-not-allowed text-white font-bold text-sm flex items-center justify-center gap-2 transition-all"

              <span id="downloadBtnText">Download</span>
            </button>

            <button 
              id="resetBtn"
              type="button"
              onclick="resetAll()"
              disabled
              class="w-full min-h-[48px] py-3 px-4 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-[0.98] disabled:opacity-40 disabled:cursor-not-allowed text-slate-700 dark:text-slate-200 font-bold text-sm flex items-center justify-center gap-2 transition-all"

      <!-- MOBILE SAFE-AREA FOOTER -->
      <footer class="safe-bottom border-t border-slate-200 dark:border-slate-800 px-4 pt-3 text-center text-[11px] font-mono text-slate-400">
        FreeZip-Tools &bull; 100% cURL to Fetch
      </footer>

    </div>

  <!-- cURL TO FETCH JAVASCRIPT LOGIC -->
  <script>
    let activeFormat = 'async'; // 'async', 'promise', 'axios'
    let originalFileName = 'fetch-request.js';
    let currentParsed = null;

    // Switch between output formats
    function setFormat(fmt) {
      activeFormat = fmt;
      const btnAsync = document.getElementById('btnFormatAsync');
      const btnPromise = document.getElementById('btnFormatPromise');
      const btnAxios = document.getElementById('btnFormatAxios');

      [btnAsync, btnPromise, btnAxios].forEach(b => {
        b.className = 'px-2.5 py-0.5 rounded font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-all';
      });

      if (fmt === 'async') {
        btnAsync.className = 'px-2.5 py-0.5 rounded font-bold bg-[#E11D48] text-white transition-all';
      } else if (fmt === 'promise') {
        btnPromise.className = 'px-2.5 py-0.5 rounded font-bold bg-[#E11D48] text-white transition-all';
      } else {
        btnAxios.className = 'px-2.5 py-0.5 rounded font-bold bg-[#E11D48] text-white transition-all';
      }

      if (currentParsed) {
        renderGeneratedCode(currentParsed);
      }
    }

    // 100% In-Browser Robust cURL Argument Tokenizer & Parser
    function parseCurlCommand(raw) {
      let cmd = raw.replace(/\\\r?\n/g, ' ').trim();
      if (cmd.toLowerCase().startsWith('curl ')) {
        cmd = cmd.substring(5).trim();
      }

      const tokens = [];
      let current = '';
      let inSingle = false;
      let inDouble = false;
      let escaped = false;

      for (let i = 0; i < cmd.length; i++) {
        const ch = cmd[i];
        if (escaped) {
          current += ch;
          escaped = false;
          continue;
        }
        if (ch === '\\' && !inSingle) {
          escaped = true;
          continue;
        }
        if (ch === "'" && !inDouble) {
          inSingle = !inSingle;
          continue;
        }
        if (ch === '"' && !inSingle) {
          inDouble = !inDouble;
          continue;
        }
        if (/\s/.test(ch) && !inSingle && !inDouble) {
          if (current.length > 0) {
            tokens.push(current);
            current = '';
          }
        } else {
          current += ch;
        }
      }
      if (current.length > 0) tokens.push(current);

      let url = '';
      let method = '';
      const headers = {};
      let body = '';
      let user = '';

      for (let i = 0; i < tokens.length; i++) {
        const token = tokens[i];

        if (token === '-X' || token === '--request') {
          method = (tokens[++i] || '').toUpperCase();
        } else if (token === '-H' || token === '--header') {
          const h = tokens[++i] || '';
          const colonIdx = h.indexOf(':');
          if (colonIdx > -1) {
            const key = h.substring(0, colonIdx).trim();
            const val = h.substring(colonIdx + 1).trim();
            headers[key] = val;
          }
        } else if (token === '-d' || token === '--data' || token === '--data-raw' || token === '--data-binary') {
          body = tokens[++i] || '';
          if (!method) method = 'POST';
        } else if (token === '-u' || token === '--user') {
          user = tokens[++i] || '';
        } else if (token === '-A' || token === '--user-agent') {
          headers['User-Agent'] = tokens[++i] || '';
        } else if (!token.startsWith('-') && !url) {
          url = token.replace(/^['"]|['"]$/g, '');
        }
      }

      if (!url && tokens.length > 0) {
        const foundUrl = tokens.find(t => /^https?:\/\//i.test(t));
        if (foundUrl) url = foundUrl.replace(/^['"]|['"]$/g, '');
      }

      if (!url) url = 'https://api.example.com/endpoint';
      if (!method) method = body ? 'POST' : 'GET';

      if (user) {
        try {
          headers['Authorization'] = 'Basic ' + btoa(user);
        } catch (e) {
          headers['Authorization'] = 'Basic ' + user;
        }
      }

      return { url, method, headers, body };
    }

    // Generate Javascript Fetch / Axios Code
    function generateJsCode(parsed, format) {
      const { url, method, headers, body } = parsed;
      const hasHeaders = Object.keys(headers).length > 0;
      let isJsonBody = false;
      let parsedJsonBody = null;

      if (body) {
        try {
          parsedJsonBody = JSON.parse(body);
          isJsonBody = true;
        } catch (e) {
          isJsonBody = false;
        }
      }

      let headersStr = '';
      if (hasHeaders) {
        headersStr = JSON.stringify(headers, null, 4);
      }

      // 1. ASYNC / AWAIT
      if (format === 'async') {
        let code = `async function makeRequest() {\n  const url = "${url}";\n  const options = {\n    method: "${method}"`;

        if (hasHeaders) {
          code += `,\n    headers: ${headersStr.replace(/\n/g, '\n    ')}`;
        }

        if (body) {
          if (isJsonBody) {
            code += `,\n    body: JSON.stringify(${JSON.stringify(parsedJsonBody, null, 2).replace(/\n/g, '\n    ')})`;
          } else {
            code += `,\n    body: ${JSON.stringify(body)}`;
          }
        }

        code += `\n  };\n\n  try {\n    const response = await fetch(url, options);\n    const result = await response.json();\n    console.log(result);\n  } catch (error) {\n    console.error("Fetch error:", error);\n  }\n}\n\nmakeRequest();`;
        return code;
      }

      // 2. PROMISE (.then)
      if (format === 'promise') {
        let code = `fetch("${url}", {\n  method: "${method}"`;

        if (hasHeaders) {
          code += `,\n  headers: ${headersStr.replace(/\n/g, '\n  ')}`;
        }

        if (body) {
          if (isJsonBody) {
            code += `,\n  body: JSON.stringify(${JSON.stringify(parsedJsonBody, null, 2).replace(/\n/g, '\n  ')})`;
          } else {
            code += `,\n  body: ${JSON.stringify(body)}`;
          }
        }

        code += `\n})\n  .then(response => response.json())\n  .then(data => console.log(data))\n  .catch(error => console.error("Request failed:", error));`;
        return code;
      }

      // 3. AXIOS
      if (format === 'axios') {
        let code = `const axios = require('axios'); // or import axios from 'axios'\n\n`;
        code += `async function sendAxiosRequest() {\n  const config = {\n    method: "${method.toLowerCase()}",\n    url: "${url}"`;

        if (hasHeaders) {
          code += `,\n    headers: ${headersStr.replace(/\n/g, '\n    ')}`;
        }

        if (body) {
          if (isJsonBody) {
            code += `,\n    data: ${JSON.stringify(parsedJsonBody, null, 2).replace(/\n/g, '\n    ')}`;
          } else {
            code += `,\n    data: ${JSON.stringify(body)}`;
          }
        }

        code += `\n  };\n\n  try {\n    const response = await axios(config);\n    console.log(response.data);\n  } catch (error) {\n    console.error("Axios error:", error);\n  }\n}\n\nsendAxiosRequest();`;
        return code;
      }

      return '';
    }

    function renderGeneratedCode(parsed) {
      const code = generateJsCode(parsed, activeFormat);
      const output = document.getElementById('fetchOutput');
      output.value = code;

      const lines = code.split('\n').length;
      document.getElementById('charCountDisplay').innerText = `${lines} lines (${code.length} chars)`;
    }

    function processCurl(raw) {
      const status = document.getElementById('statusText');
      const validationBadge = document.getElementById('validationBadge');
      const downloadBtn = document.getElementById('downloadBtn');
      const resetBtn = document.getElementById('resetBtn');
      const output = document.getElementById('fetchOutput');

      if (!raw.trim()) {
        currentParsed = null;
        output.value = '';
        status.innerText = 'Upload cURL file or paste command below';
        validationBadge.innerText = 'Waiting for cURL input...';
        validationBadge.className = 'text-slate-400';
        document.getElementById('charCountDisplay').innerText = '0 lines';
        downloadBtn.disabled = true;
        resetBtn.disabled = true;
        return;
      }

      resetBtn.disabled = false;

      try {
        currentParsed = parseCurlCommand(raw);
        renderGeneratedCode(currentParsed);

        validationBadge.innerHTML = `<span class="text-emerald-600 dark:text-emerald-400 font-bold"><i class="fa-solid fa-circle-check mr-1"></i>Parsed ${currentParsed.method}</span>`;
        status.innerText = `cURL converted to ${activeFormat.toUpperCase()}!`;
        downloadBtn.disabled = false;
      } catch (err) {
        console.error(err);
        currentParsed = null;
        output.value = '';
        validationBadge.innerHTML = `<span class="text-red-500 font-bold"><i class="fa-solid fa-circle-xmark mr-1"></i>Parsing error</span>`;
        status.innerText = 'Malformed cURL syntax';
        downloadBtn.disabled = true;
      }
    }

    function handleInput(val) {
      processCurl(val);
    }

    // 1. Upload File Handler
    async function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const status = document.getElementById('statusText');
      status.innerText = `Reading ${file.name}...`;

      try {
        originalFileName = file.name.replace(/\.[^/.]+$/, "") + '-fetch.js';
        const text = await file.text();
        document.getElementById('curlInput').value = text;
        processCurl(text);
        status.innerText = `Loaded ${file.name} successfully!`;
      } catch (err) {
        console.error(err);
        status.innerText = 'Could not read file.';
      }

      event.target.value = '';
    }

    // Quick Test Sample cURL
    function loadSampleCurl() {
      const sample = `curl -X POST https://api.freezip-tools.com/v1/process \\
  -H "Content-Type: application/json" \\
  -H "Authorization: Bearer fz_live_sec_994821" \\
  -d '{"task": "convert", "format": "zip", "priority": "high", "async": true}'`;

      originalFileName = 'sample-fetch.js';
      document.getElementById('curlInput').value = sample;
      processCurl(sample);
    }

    // Copy to Clipboard
    function copyFetchCode() {
      const output = document.getElementById('fetchOutput');
      if (!output.value.trim()) return;

      const tempArea = document.createElement('textarea');
      tempArea.value = output.value;
      document.body.appendChild(tempArea);
      tempArea.select();
      try {
        document.execCommand('copy');
        const copyBtnText = document.getElementById('copyBtnText');
        copyBtnText.innerText = 'Copied!';
        setTimeout(() => {
          copyBtnText.innerText = 'Copy';
        }, 1800);
      } catch (e) {
        console.error('Copy failed');
      }
      document.body.removeChild(tempArea);
    }

    // 2. Download Generated JavaScript File
    function downloadResultFile() {
      const output = document.getElementById('fetchOutput');
      const val = output.value;
      if (!val.trim()) return;

      const blob = new Blob([val], { type: 'text/javascript;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = originalFileName.endsWith('.js') ? originalFileName : `${originalFileName}.js`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      document.getElementById('statusText').innerText = `Downloaded ${a.download}!`;
    }

    // 3. Reset Handler
    function resetAll() {
      currentParsed = null;
      originalFileName = 'fetch-request.js';
      document.getElementById('curlInput').value = '';
      document.getElementById('fetchOutput').value = '';
      document.getElementById('statusText').innerText = 'Upload cURL file or paste command below';
      document.getElementById('validationBadge').innerText = 'Waiting for cURL input...';
      document.getElementById('validationBadge').className = 'text-slate-400';
      document.getElementById('charCountDisplay').innerText = '0 lines';
      document.getElementById('downloadBtn').disabled = true;
      document.getElementById('resetBtn').disabled = true;
      setFormat('async');
    }

    // Minimal Theme Switcher
    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      const icon = document.getElementById('themeIcon');
      icon.className = isDark ? 'fa-solid fa-sun text-xs text-amber-400' : 'fa-solid fa-moon text-xs';
      localStorage.setItem('freezip_theme', isDark ? 'dark' : 'light');
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('freezip_theme') === 'dark') {
        document.documentElement.classList.add('dark');
        document.getElementById('themeIcon').className = 'fa-solid fa-sun text-xs text-amber-400';
      }
    });
  </script>
