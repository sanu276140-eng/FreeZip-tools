<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>JS Obfuscator — FreeZip</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    html, body {
      overscroll-behavior-y: none;
    }
    .wireframe-container {
      border-left: none;
      border-right: none;
    }
    @media (min-width: 640px) {
      .wireframe-container {
        border-left: 1.5px solid rgba(203, 213, 225, 0.8);
        border-right: 1.5px solid rgba(203, 213, 225, 0.8);
      }
      .dark .wireframe-container {
        border-left: 1.5px solid rgba(51, 65, 85, 0.7);
        border-right: 1.5px solid rgba(51, 65, 85, 0.7);
      }
    }
    .safe-bottom {
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
    }
    textarea {
      tab-size: 2;
    }
  </style>
</head>

<body class="bg-white sm:bg-slate-100/70 dark:bg-[#0D131F] sm:dark:bg-[#070b12] text-slate-800 dark:text-slate-100 min-h-[100dvh] font-sans transition-colors duration-200 antialiased flex flex-col overflow-x-hidden select-none">

  <!-- MOBILE-FIRST OUTER WRAPPER -->
  <div class="w-full max-w-[1140px] mx-auto px-0 sm:px-6 md:px-10 flex-1 flex flex-col">

    <!-- MINIMAL WIREFRAME CONTAINER -->
    <div class="wireframe-container bg-white dark:bg-[#0D131F] flex-1 flex flex-col justify-between sm:shadow-sm">

      <!-- MOBILE-FIRST HEADER -->
      <header class="border-b border-slate-200 dark:border-slate-800 px-4 sm:px-6 md:px-8 h-14 sm:h-16 flex items-center justify-between gap-2 sticky top-0 z-30 bg-white/95 dark:bg-[#0D131F]/95 backdrop-blur-md">
        <a href="https://www.freezip.site/" class="flex items-center gap-2.5 font-bold tracking-tight text-slate-900 dark:text-white group">
          <span class="w-8 h-8 rounded-lg bg-red-500 text-white flex items-center justify-center text-xs shadow-sm shadow-red-500/40 group-hover:rotate-6 transition-transform">
            <i class="fa-solid fa-shapes"></i>
          </span>
          <span class="text-base font-extrabold uppercase tracking-wide">
            Free<span class="text-red-500">Zip-Tools</span>
          </span>
        </a>

        <div class="flex items-center gap-2 shrink-0">
          <a href="https://www.freezip.site/" class="h-10 px-3 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-300 bg-slate-100/80 dark:bg-slate-800/60 hover:text-red-500 active:scale-95 transition-all flex items-center gap-1.5">
            <i class="fa-solid fa-arrow-left text-[11px]"></i>
            <span>Home</span>
          </a>
          <button onclick="toggleTheme()" aria-label="Toggle Theme" class="w-10 h-10 rounded-xl border border-slate-200 dark:border-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300 active:scale-95 transition-all">
            <i id="themeIcon" class="fa-solid fa-moon text-sm"></i>
          </button>
        </div>
      </header>

      <!-- MOBILE-FIRST MAIN WORKSPACE -->
      <main class="flex-1 flex flex-col justify-center px-4 py-5 sm:p-8 md:p-12 w-full">
        <div class="w-full max-w-md mx-auto border border-slate-200/90 dark:border-slate-800 rounded-2xl bg-slate-50/70 dark:bg-[#111827]/80 p-5 sm:p-7 text-center space-y-5 shadow-sm">

          <!-- Website Logo & Brand Identity Badge -->
          <div class="flex flex-col items-center justify-center gap-2 pt-1">
            <a href="index.html" title="FreeZip-Tools Home" class="group flex flex-col items-center">
              <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-red-600 to-rose-500 text-white flex items-center justify-center shadow-lg shadow-red-500/25 ring-4 ring-red-500/10 dark:ring-red-500/20 group-hover:scale-105 group-hover:rotate-3 transition-transform duration-200">
                <i class="fa-solid fa-shapes text-2xl"></i>
              </div>
            </a>
            <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-red-50 dark:bg-red-950/50 border border-red-200/70 dark:border-red-900/50 text-[11px] font-mono font-bold text-red-600 dark:text-red-400">
              <i class="fa-solid fa-shapes text-[10px]"></i>
              <span>FREE<span class="text-red-500">ZIP-TOOLS</span></span>
            </div>
          </div>

          <!-- Title & Live Status -->
          <div class="space-y-1">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">
              JS Obfuscator
            </h1>
            <p id="statusText" class="text-xs font-mono text-slate-500 dark:text-slate-400 break-words">
              Upload JS file or paste script below
            </p>
          </div>

          <!-- Hidden File Input -->
          <input 
            type="file" 
            id="jsFileInput" 
            accept=".js,.ts,.mjs,.txt,text/javascript,text/plain" 
            class="hidden" 
            onchange="handleJsUpload(event)"
          >

          <!-- 1. MAIN BUTTON: UPLOAD JAVASCRIPT (Fixed Brand Red #E11D48, 54px Mobile Thumb Size) -->
          <div>
            <button 
              type="button"
              onclick="document.getElementById('jsFileInput').click()"
              class="w-full min-h-[54px] py-3.5 px-5 rounded-xl bg-[#E11D48] hover:bg-rose-700 active:scale-[0.98] text-white font-bold text-base shadow-md shadow-rose-500/25 flex items-center justify-center gap-2.5 transition-all cursor-pointer"
            >
              <i class="fa-brands fa-js text-xl"></i>
              <span>Upload JavaScript</span>
            </button>
          </div>

          <!-- Minimalist Editor & Obfuscation Mode Controls -->
          <div class="border border-slate-200 dark:border-slate-800 rounded-xl bg-white/70 dark:bg-slate-900/60 p-3 text-left space-y-2.5">
            <!-- Mode Selector Pills (String Array, Hex Encode, IIFE Wrapper) -->
            <div class="flex items-center justify-between text-xs flex-wrap gap-1">
              <div class="flex items-center gap-1 font-mono text-[11px]">
                <button type="button" onclick="setMode('standard')" id="modeStandardBtn" class="px-2 py-0.5 rounded font-bold bg-[#E11D48] text-white transition-all">Table</button>
                <button type="button" onclick="setMode('hex')" id="modeHexBtn" class="px-2 py-0.5 rounded font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-all">Hex</button>
                <button type="button" onclick="setMode('iife')" id="modeIifeBtn" class="px-2 py-0.5 rounded font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-all">Self-Defend</button>
              </div>

              <!-- Quick Sample & Copy Helper -->
              <div class="flex items-center gap-2">
                <button type="button" onclick="loadSampleJs()" class="text-[10px] font-mono font-semibold text-red-500 hover:text-red-700 dark:hover:text-red-400">
                  Sample
                </button>
                <button type="button" onclick="copyObfuscatedJs()" id="copyBtn" class="text-[10px] font-mono font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 flex items-center gap-1">
                  <i class="fa-regular fa-copy text-[10px]"></i>
                  <span id="copyBtnText">Copy</span>
                </button>
              </div>
            </div>

            <!-- JavaScript Code Input -->
            <div class="relative">
              <textarea 
                id="jsEditor"
                rows="7"
                oninput="handleEditorInput(this.value)"
                placeholder="Paste raw JavaScript here or click 'Upload JavaScript'..."
                class="w-full p-2.5 text-xs font-mono rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-slate-800 dark:text-slate-200 placeholder-slate-400 focus:outline-none focus:border-red-500 transition-colors resize-y leading-relaxed"
                spellcheck="false"
              ></textarea>
            </div>

            <!-- Live Status & Stats Pill -->
            <div class="flex items-center justify-between text-[11px] font-mono">
              <span id="validationBadge" class="text-slate-400">Waiting for JS input...</span>
              <span id="statusStats" class="text-slate-400 font-semibold">0 chars</span>
            </div>
          </div>

          <!-- 2 & 3. ACTION BUTTONS: DOWNLOAD & RESET (2-Column Thumb Grid) -->
          <div class="grid grid-cols-2 gap-2.5 sm:gap-3 pt-1">
            <button 
              id="downloadBtn"
              type="button"
              onclick="downloadJsFile()"
              disabled
              class="w-full min-h-[48px] py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] disabled:bg-slate-200 dark:disabled:bg-slate-800 disabled:text-slate-400 disabled:cursor-not-allowed text-white font-bold text-sm flex items-center justify-center gap-2 transition-all"
            >
              <i class="fa-solid fa-download text-xs"></i>
              <span id="downloadBtnText">Download</span>
            </button>

            <button 
              id="resetBtn"
              type="button"
              onclick="resetAll()"
              disabled
              class="w-full min-h-[48px] py-3 px-4 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-[0.98] disabled:opacity-40 disabled:cursor-not-allowed text-slate-700 dark:text-slate-200 font-bold text-sm flex items-center justify-center gap-2 transition-all"
            >
              <i class="fa-solid fa-rotate-left text-xs"></i>
              <span>Reset</span>
            </button>
          </div>

        </div>
      </main>

      <!-- MOBILE SAFE-AREA FOOTER -->
      <footer class="safe-bottom border-t border-slate-200 dark:border-slate-800 px-4 pt-3 text-center text-[11px] font-mono text-slate-400">
        FreeZip-Tools &bull; 100% JS Obfuscator
      </footer>

    </div>
  </div>

  <!-- JS OBFUSCATION JAVASCRIPT LOGIC -->
  <script>
    let activeMode = 'standard'; // 'standard', 'hex', 'iife'
    let rawJs = '';
    let originalFileName = 'script.js';

    // Mode Selector Pills
    function setMode(mode) {
      activeMode = mode;
      const btnStandard = document.getElementById('modeStandardBtn');
      const btnHex = document.getElementById('modeHexBtn');
      const btnIife = document.getElementById('modeIifeBtn');

      [btnStandard, btnHex, btnIife].forEach(b => {
        b.className = 'px-2 py-0.5 rounded font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-all';
      });

      if (mode === 'standard') {
        btnStandard.className = 'px-2 py-0.5 rounded font-bold bg-[#E11D48] text-white transition-all';
      } else if (mode === 'hex') {
        btnHex.className = 'px-2 py-0.5 rounded font-bold bg-[#E11D48] text-white transition-all';
      } else {
        btnIife.className = 'px-2 py-0.5 rounded font-bold bg-[#E11D48] text-white transition-all';
      }

      if (rawJs.trim()) {
        const obfuscated = obfuscateJs(rawJs, activeMode);
        document.getElementById('jsEditor').value = obfuscated;
        updateUIStats(rawJs, obfuscated);
      }
    }

    // Helper: Convert string to hexadecimal escape sequence
    function toHexEscapedString(str) {
      let hex = '';
      for (let i = 0; i < str.length; i++) {
        const code = str.charCodeAt(i).toString(16);
        hex += '\\x' + (code.length === 1 ? '0' + code : code);
      }
      return hex;
    }

    // Helper: Generate randomized hex identifier
    function getRandomHexId() {
      return '_0x' + Math.floor(Math.random() * 0xFFFFF).toString(16);
    }

    // In-browser Client-Side JS Obfuscation Engine (Produces genuine runnable JS)
    function obfuscateJs(code, mode) {
      if (!code.trim()) return '';

      // Strip single-line and multi-line comments
      let clean = code
        .replace(/\/\*[\s\S]*?\*\//g, '')
        .replace(/(^|[^:])\/\/[^\n]*/g, '$1')
        .trim();

      // MODE 1: String Table Extraction + Hex Lookups + Compacting
      if (mode === 'standard') {
        const stringLiterals = [];
        const tableId = getRandomHexId();
        const funcId = getRandomHexId();

        // Extract double and single quoted strings safely
        clean = clean.replace(/(["'])(.*?)\1/g, (match, quote, content) => {
          if (!content) return quote + quote;
          const index = stringLiterals.length;
          stringLiterals.push(toHexEscapedString(content));
          return `${funcId}(${index})`;
        });

        // Minify whitespace around delimiters
        clean = clean
          .replace(/\s+/g, ' ')
          .replace(/\s*([\{\}:;,=\+\-\*\/\(\)><])\s*/g, '$1')
          .trim();

        if (stringLiterals.length > 0) {
          const stringArrayDecl = `const ${tableId}=[${stringLiterals.map(s => `'${s}'`).join(',')}];`;
          const accessorFunc = `function ${funcId}(_0xidx){return ${tableId}[_0xidx];};`;
          return `${stringArrayDecl}${accessorFunc}${clean}`;
        }
        return clean;
      }

      // MODE 2: Pure Hex Escape Encoding
      if (mode === 'hex') {
        clean = clean.replace(/(["'])(.*?)\1/g, (match, quote, content) => {
          if (!content) return quote + quote;
          return quote + toHexEscapedString(content) + quote;
        });

        return clean
          .replace(/\s+/g, ' ')
          .replace(/\s*([\{\}:;,=\+\-\*\/\(\)><])\s*/g, '$1')
          .trim();
      }

      // MODE 3: Self-Defending IIFE Sandbox + Integrity Anchor
      if (mode === 'iife') {
        const tableId = getRandomHexId();
        const funcId = getRandomHexId();
        const stringLiterals = [];

        clean = clean.replace(/(["'])(.*?)\1/g, (match, quote, content) => {
          if (!content) return quote + quote;
          const index = stringLiterals.length;
          stringLiterals.push(toHexEscapedString(content));
          return `${funcId}(${index})`;
        });

        clean = clean
          .replace(/\s+/g, ' ')
          .replace(/\s*([\{\}:;,=\+\-\*\/\(\)><])\s*/g, '$1')
          .trim();

        const tableDecl = stringLiterals.length > 0 
          ? `const ${tableId}=[${stringLiterals.map(s => `'${s}'`).join(',')}];function ${funcId}(_0x0){return ${tableId}[_0x0];};` 
          : '';

        return `(function(){'use strict';const _0xguard=function(){return true;};if(!_0xguard()){return;};${tableDecl}${clean}})();`;
      }

      return clean;
    }

    // Update Live Statistics
    function updateUIStats(original, processed) {
      const statusStats = document.getElementById('statusStats');
      const validationBadge = document.getElementById('validationBadge');
      const statusText = document.getElementById('statusText');

      if (!original.trim()) {
        statusStats.innerText = '0 chars';
        validationBadge.innerText = 'Waiting for JS input...';
        validationBadge.className = 'text-slate-400';
        statusText.innerText = 'Upload JS file or paste script below';
        return;
      }

      const procLen = processed.length;
      statusStats.innerText = `${procLen} chars`;
      validationBadge.innerHTML = '<span class="text-emerald-600 dark:text-emerald-400 font-bold"><i class="fa-solid fa-shield-halved mr-1"></i>Protected & Ready</span>';
      statusText.innerText = 'Obfuscated code ready to download';
    }

    // Live Textarea Listener
    function handleEditorInput(val) {
      rawJs = val;
      const downloadBtn = document.getElementById('downloadBtn');
      const resetBtn = document.getElementById('resetBtn');

      if (!val.trim()) {
        downloadBtn.disabled = true;
        resetBtn.disabled = true;
        updateUIStats('', '');
        return;
      }

      resetBtn.disabled = false;
      downloadBtn.disabled = false;
      updateUIStats(rawJs, val);
    }

    // 1. Upload JS File Handler
    async function handleJsUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const status = document.getElementById('statusText');
      status.innerText = 'Reading JavaScript file...';

      try {
        const text = await file.text();
        rawJs = text;
        originalFileName = file.name.endsWith('.js') ? file.name : `${file.name}.js`;

        const obfuscated = obfuscateJs(text, activeMode);
        document.getElementById('jsEditor').value = obfuscated;
        document.getElementById('downloadBtn').disabled = false;
        document.getElementById('resetBtn').disabled = false;
        updateUIStats(rawJs, obfuscated);
        status.innerText = `Loaded ${file.name} successfully!`;
      } catch (err) {
        console.error(err);
        status.innerText = 'Could not read JavaScript file.';
      }

      event.target.value = '';
    }

    // Quick Test Sample JavaScript
    function loadSampleJs() {
      const sample = `// FreeZip-Tools Sample Application
function processSecureTransaction(userId, amount) {
  const currency = "USD";
  const status = "authorized";
  console.log("Processing " + amount + " " + currency + " for user: " + userId);
  return {
    success: true,
    code: 200,
    message: "Transaction " + status
  };
}

const result = processSecureTransaction("usr_9812", 49.99);
console.log(result.message);`;

      rawJs = sample;
      originalFileName = 'sample.js';
      const obfuscated = obfuscateJs(sample, activeMode);
      document.getElementById('jsEditor').value = obfuscated;
      document.getElementById('downloadBtn').disabled = false;
      document.getElementById('resetBtn').disabled = false;
      updateUIStats(rawJs, obfuscated);
    }

    // Copy to Clipboard (using document.execCommand for iframe sandbox reliability)
    function copyObfuscatedJs() {
      const editor = document.getElementById('jsEditor');
      if (!editor.value.trim()) return;

      editor.select();
      editor.setSelectionRange(0, 99999);
      try {
        document.execCommand('copy');
        const copyBtnText = document.getElementById('copyBtnText');
        copyBtnText.innerText = 'Copied!';
        setTimeout(() => {
          copyBtnText.innerText = 'Copy';
        }, 1800);
      } catch (e) {
        console.error('Copy failed');
      }
    }

    // 2. Download Obfuscated JS File
    function downloadJsFile() {
      const editor = document.getElementById('jsEditor');
      const content = editor.value;
      if (!content.trim()) return;

      const blob = new Blob([content], { type: 'text/javascript;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = originalFileName.replace(/\.(js|ts|mjs|txt)$/i, '') + '-obfuscated.js';

      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      document.getElementById('statusText').innerText = `Downloaded ${a.download}!`;
    }

    // 3. Reset Handler
    function resetAll() {
      rawJs = '';
      originalFileName = 'script.js';
      document.getElementById('jsEditor').value = '';
      document.getElementById('statusText').innerText = 'Upload JS file or paste script below';
      document.getElementById('validationBadge').innerText = 'Waiting for JS input...';
      document.getElementById('validationBadge').className = 'text-slate-400';
      document.getElementById('statusStats').innerText = '0 chars';
      document.getElementById('downloadBtn').disabled = true;
      document.getElementById('resetBtn').disabled = true;
      setMode('standard');
    }

    // Minimal Theme Switcher (Syncs with localStorage)
    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      const icon = document.getElementById('themeIcon');
      icon.className = isDark ? 'fa-solid fa-sun text-xs text-amber-400' : 'fa-solid fa-moon text-xs';
      localStorage.setItem('freezip_theme', isDark ? 'dark' : 'light');
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('freezip_theme') === 'dark') {
        document.documentElement.classList.add('dark');
        document.getElementById('themeIcon').className = 'fa-solid fa-sun text-xs text-amber-400';
      }
    });
  </script>
</body>
</html>
