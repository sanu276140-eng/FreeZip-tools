    // Standalone Pure JavaScript RFC 1321 MD5 Algorithm (Ensures 100% offline & zero-dependency execution)
    function rfc1321Md5(string) {
      function rotateLeft(lValue, iShiftBits) {
        return (lValue << iShiftBits) | (lValue >>> (32 - iShiftBits));

        const lX8 = (lX & 0x80000000);
        const lY8 = (lY & 0x80000000);
        const lX4 = (lX & 0x40000000);
        const lY4 = (lY & 0x40000000);
        const lResult = (lX & 0x3FFFFFFF) + (lY & 0x3FFFFFFF);
        if (lX4 & lY4) return (lResult ^ 0x80000000 ^ lX8 ^ lY8);
        if (lX4 | lY4) {
          if (lResult & 0x40000000) return (lResult ^ 0xC0000000 ^ lX8 ^ lY8);
          return (lResult ^ 0x40000000 ^ lX8 ^ lY8);
        }
        return (lResult ^ lX8 ^ lY8);
      }
      function F(x, y, z) { return (x & y) | ((~x) & z); }
      function G(x, y, z) { return (x & z) | (y & (~z)); }
      function H(x, y, z) { return (x ^ y ^ z); }
      function I(x, y, z) { return (y ^ (x | (~z))); }
      function FF(a, b, c, d, x, s, ac) {
        a = addUnsigned(a, addUnsigned(addUnsigned(F(b, c, d), x), ac));
        return addUnsigned(rotateLeft(a, s), b);
      }
      function GG(a, b, c, d, x, s, ac) {
        a = addUnsigned(a, addUnsigned(addUnsigned(G(b, c, d), x), ac));
        return addUnsigned(rotateLeft(a, s), b);
      }
      function HH(a, b, c, d, x, s, ac) {
        a = addUnsigned(a, addUnsigned(addUnsigned(H(b, c, d), x), ac));
        return addUnsigned(rotateLeft(a, s), b);
      }
      function II(a, b, c, d, x, s, ac) {
        a = addUnsigned(a, addUnsigned(addUnsigned(I(b, c, d), x), ac));
        return addUnsigned(rotateLeft(a, s), b);

      function convertToWordArray(str) {
        let lWordCount;
        const lMessageLength = str.length;
        const lNumberOfWords_temp1 = lMessageLength + 8;
        const lNumberOfWords_temp2 = (lNumberOfWords_temp1 - (lNumberOfWords_temp1 % 64)) / 64;

        let WordToHexValue = "", WordToHexValue_temp = "", lByte, lCount;

        c = II(c, d, a, b, x[k + 10], 15, 0xFFEFF47D);
        b = II(b, c, d, a, x[k + 1], 21, 0x85845DD1);
        a = II(a, b, c, d, x[k + 8], 6, 0x6FA87E4F);
        d = II(d, a, b, c, x[k + 15], 10, 0xFE2CE6E0);
        c = II(c, d, a, b, x[k + 6], 15, 0xA3014314);
        b = II(b, c, d, a, x[k + 13], 21, 0x4E0811A1);
        a = II(a, b, c, d, x[k + 4], 6, 0xF7537E82);
        d = II(d, a, b, c, x[k + 11], 10, 0xBD3AF235);
        c = II(c, d, a, b, x[k + 2], 15, 0x2AD7D2BB);
        b = II(b, c, d, a, x[k + 9], 21, 0xEB86D391);

        a = addUnsigned(a, AA);
        b = addUnsigned(b, BB);
        c = addUnsigned(c, CC);
        d = addUnsigned(d, DD);
      }

      return (wordToHex(a) + wordToHex(b) + wordToHex(c) + wordToHex(d)).toLowerCase();
    }

    // Helper: Format byte counts cleanly
    function formatBytes(bytes) {
      if (!bytes || bytes <= 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return (bytes / Math.pow(k, i)).toFixed(2) + ' ' + sizes[i];
    }

    // Core MD5 calculation dispatcher
    function calculateMd5FromBuffer(buffer) {
      if (window.SparkMD5 && window.SparkMD5.ArrayBuffer) {
        return SparkMD5.ArrayBuffer.hash(buffer);
      }
      // Fallback: convert ArrayBuffer to binary string and compute
      const bytes = new Uint8Array(buffer);
      let binary = '';
      const len = bytes.byteLength;
      for (let i = 0; i < len; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return rfc1321Md5(binary);
    }

    function calculateMd5FromText(str) {
      if (window.SparkMD5) {
        return SparkMD5.hash(str);
      }
      return rfc1321Md5(str);
    }

    // Process Text Input
    function handleTextInput(text) {
      currentSourceType = 'text';
      document.getElementById('fileInfoBox').classList.add('hidden');
      fileBuffer = null;

      if (!text) {
        currentHash = '';
        document.getElementById('hashOutput').value = '';
        document.getElementById('statusText').innerText = 'Upload file or enter text to compute 128-bit MD5 checksum';
        document.getElementById('downloadBtn').disabled = true;
        verifyHash(document.getElementById('verifyInput').value);
        return;
      }

      const rawHex = calculateMd5FromText(text);
      applyHashOutput(rawHex);

      document.getElementById('statusText').innerText = `Computed MD5 for ${text.length} character(s)`;
      document.getElementById('downloadBtn').disabled = false;
    }

    // Apply Hash Output to Textarea with case formatting
    function applyHashOutput(hex) {
      currentHash = hex;
      const formatted = isUppercase ? hex.toUpperCase() : hex.toLowerCase();
      document.getElementById('hashOutput').value = formatted;
      verifyHash(document.getElementById('verifyInput').value);
    }

    // Toggle Upper/Lower Case
    function toggleCase() {
      isUppercase = !isUppercase;
      const btn = document.getElementById('caseToggleBtn');
      btn.innerText = isUppercase ? 'UPPERCASE' : 'lowercase';
      btn.className = isUppercase 
        ? 'px-2 py-0.5 rounded font-bold bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-slate-200 transition-all'
        : 'px-2 py-0.5 rounded font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-all';

      if (currentHash) {
        applyHashOutput(currentHash);
      }
    }

    // 1. Upload File Handler
    async function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const status = document.getElementById('statusText');
      status.innerText = `Calculating MD5 for ${file.name}...`;

      try {
        currentSourceType = 'file';
        currentFileName = file.name;
        document.getElementById('sourceInput').value = '';

        fileBuffer = await file.arrayBuffer();
        const rawHex = calculateMd5FromBuffer(fileBuffer);

        // Update File Info Pill
        document.getElementById('fileNameDisplay').innerText = file.name;
        document.getElementById('fileSizeDisplay').innerText = `(${formatBytes(file.size)})`;
        document.getElementById('fileInfoBox').classList.remove('hidden');

        applyHashOutput(rawHex);
        status.innerText = `Computed MD5 for ${file.name} (${formatBytes(file.size)})`;
        document.getElementById('downloadBtn').disabled = false;
      } catch (err) {
        console.error(err);
        status.innerText = 'Error reading file for MD5 hash.';
      }

      event.target.value = '';
    }

    // Clear Uploaded File
    function clearFile() {
      fileBuffer = null;
      currentSourceType = 'text';
      document.getElementById('fileInfoBox').classList.add('hidden');
      document.getElementById('sourceInput').value = '';
      currentHash = '';
      document.getElementById('hashOutput').value = '';
      document.getElementById('downloadBtn').disabled = true;
      document.getElementById('statusText').innerText = 'File removed. Enter text or upload another file.';
      verifyHash('');
    }

    // Quick Test Sample Text
    function loadSampleText() {
      const sample = "The quick brown fox jumps over the lazy dog";
      document.getElementById('sourceInput').value = sample;
      handleTextInput(sample);
    }

    // Checksum Comparator / Verifier
    function verifyHash(expected) {
      const badge = document.getElementById('matchStatusBadge');
      const cleanExpected = expected.trim().toLowerCase();
      const current = currentHash.toLowerCase();

      if (!cleanExpected) {
        badge.innerText = 'Optional';
        badge.className = 'text-[10px] text-slate-400';
        return;
      }

      if (!current) {
        badge.innerText = 'Waiting for hash...';
        badge.className = 'text-[10px] text-slate-400';
        return;
      }

      if (cleanExpected === current) {
        badge.innerHTML = '<span class="text-emerald-600 dark:text-emerald-400 font-bold flex items-center gap-1"><i class="fa-solid fa-check"></i> MATCH</span>';
      } else {
        badge.innerHTML = '<span class="text-rose-500 font-bold flex items-center gap-1"><i class="fa-solid fa-xmark"></i> MISMATCH</span>';
      }
    }

    // Dedicated Working Copy Button for MD5 Checksum
    function copyHashOutput() {
      const output = document.getElementById('hashOutput');
      if (!output.value.trim()) return;

      copyTextToClipboard(output.value);
      const copyText = document.getElementById('copyHashText');
      const copyIcon = document.getElementById('copyHashIcon');

      copyText.innerText = 'Copied!';
      copyIcon.className = 'fa-solid fa-check text-[10px] text-emerald-500';

      setTimeout(() => {
        copyText.innerText = 'Copy Hash';
        copyIcon.className = 'fa-regular fa-copy text-[10px]';
      }, 1800);

      document.getElementById('statusText').innerText = 'Copied MD5 hash to clipboard!';
    }

    // Universal copy helper using execCommand
    function copyTextToClipboard(text) {
      const temp = document.createElement('textarea');
      temp.value = text;
      temp.style.position = 'fixed';
      temp.style.left = '-9999px';
      temp.style.top = '0';
      document.body.appendChild(temp);
      temp.focus();
      temp.select();
      try {
        document.execCommand('copy');
      } catch (e) {
        console.error('Copy failed');
      }
      document.body.removeChild(temp);
    }

    // 2. Download MD5 (.txt) File
    function downloadHashFile() {
      if (!currentHash) return;

      const outputVal = isUppercase ? currentHash.toUpperCase() : currentHash.toLowerCase();
      let fileTitle = 'md5-hash.txt';
      let content = '';

      if (currentSourceType === 'file') {
        fileTitle = `${currentFileName}.md5.txt`;
        content = `# MD5 Checksum\nFile: ${currentFileName}\nMD5: ${outputVal}\n`;
      } else {
        const textSnippet = document.getElementById('sourceInput').value.slice(0, 80);
        content = `# MD5 Checksum\nInput: "${textSnippet}..."\nMD5: ${outputVal}\n`;
      }

      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileTitle;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      document.getElementById('statusText').innerText = `Downloaded ${fileTitle}!`;
    }

    // 3. Reset Handler
    function resetAll() {
      currentHash = '';
      currentSourceType = 'text';
      fileBuffer = null;
      isUppercase = false;

      document.getElementById('sourceInput').value = '';
      document.getElementById('hashOutput').value = '';
      document.getElementById('verifyInput').value = '';
      document.getElementById('fileInfoBox').classList.add('hidden');
      document.getElementById('matchStatusBadge').innerText = 'Optional';
      document.getElementById('matchStatusBadge').className = 'text-[10px] text-slate-400';
      document.getElementById('statusText').innerText = 'Upload file or enter text to compute 128-bit MD5 checksum';
      document.getElementById('downloadBtn').disabled = true;

      const btn = document.getElementById('caseToggleBtn');
      btn.innerText = 'lowercase';
      btn.className = 'px-2 py-0.5 rounded font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-all';
    }

    // Theme Switcher Sync with localStorage
    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      const icon = document.getElementById('themeIcon');
      icon.className = isDark ? 'fa-solid fa-sun text-xs text-amber-400' : 'fa-solid fa-moon text-xs';
      localStorage.setItem('freezip_theme', isDark ? 'dark' : 'light');
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('freezip_theme') === 'dark') {
        document.documentElement.classList.add('dark');
        document.getElementById('themeIcon').className = 'fa-solid fa-sun text-xs text-amber-400';
      }
    });
  </script>
</body>
</html>
