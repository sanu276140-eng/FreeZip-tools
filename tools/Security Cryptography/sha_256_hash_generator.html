<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>SHA-256 Hash Generator — FreeZip</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link
  rel="icon"
  type="image/svg+xml"
  href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23ef4444'/%3E%3Ctext x='50' y='67' font-size='58' text-anchor='middle' fill='white'%3E✥%3C/text%3E%3C/svg%3E">
  
  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    html, body {
      overscroll-behavior-y: none;
    }
    .wireframe-container {
      border-left: none;
      border-right: none;
    }
    @media (min-width: 640px) {
      .wireframe-container {
        border-left: 1.5px solid rgba(203, 213, 225, 0.8);
        border-right: 1.5px solid rgba(203, 213, 225, 0.8);
      }
      .dark .wireframe-container {
        border-left: 1.5px solid rgba(51, 65, 85, 0.7);
        border-right: 1.5px solid rgba(51, 65, 85, 0.7);
      }
    }
    .safe-bottom {
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
    }
    textarea {
      tab-size: 2;
    }
  </style>
</head>

<body class="bg-white sm:bg-slate-100/70 dark:bg-[#0D131F] sm:dark:bg-[#070b12] text-slate-800 dark:text-slate-100 min-h-[100dvh] font-sans transition-colors duration-200 antialiased flex flex-col overflow-x-hidden select-none">

  <!-- MOBILE-FIRST OUTER WRAPPER -->
  <div class="w-full max-w-[1140px] mx-auto px-0 sm:px-6 md:px-10 flex-1 flex flex-col">

    <!-- MINIMAL WIREFRAME CONTAINER -->
    <div class="wireframe-container bg-white dark:bg-[#0D131F] flex-1 flex flex-col justify-between sm:shadow-sm">

      <!-- MOBILE-FIRST HEADER -->
      <header class="border-b border-slate-200 dark:border-slate-800 px-4 sm:px-6 md:px-8 h-14 sm:h-16 flex items-center justify-between gap-2 sticky top-0 z-30 bg-white/95 dark:bg-[#0D131F]/95 backdrop-blur-md">
        <a href="https://www.freezip.site/" class="flex items-center gap-2.5 font-bold tracking-tight text-slate-900 dark:text-white group">
          <span class="w-8 h-8 rounded-lg bg-red-500 text-white flex items-center justify-center text-xs shadow-sm shadow-red-500/40 group-hover:rotate-6 transition-transform">
            <i class="fa-solid fa-shapes"></i>
          </span>
          <span class="text-base font-extrabold uppercase tracking-wide">
            Free<span class="text-red-500">Zip-Tools</span>
          </span>
        </a>

        <div class="flex items-center gap-2 shrink-0">
          <a href="https://www.freezip.site/" class="h-10 px-3 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-300 bg-slate-100/80 dark:bg-slate-800/60 hover:text-red-500 active:scale-95 transition-all flex items-center gap-1.5">
            <i class="fa-solid fa-arrow-left text-[11px]"></i>
            <span>Home</span>
          </a>
          <button onclick="toggleTheme()" aria-label="Toggle Theme" class="w-10 h-10 rounded-xl border border-slate-200 dark:border-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300 active:scale-95 transition-all">
            <i id="themeIcon" class="fa-solid fa-moon text-sm"></i>
          </button>
        </div>
      </header>

      <!-- MOBILE-FIRST MAIN WORKSPACE -->
      <main class="flex-1 flex flex-col justify-center px-4 py-5 sm:p-8 md:p-12 w-full">
        <div class="w-full max-w-md mx-auto border border-slate-200/90 dark:border-slate-800 rounded-2xl bg-slate-50/70 dark:bg-[#111827]/80 p-5 sm:p-7 text-center space-y-5 shadow-sm">

          <!-- Website Logo & Brand Identity Badge -->
          <div class="flex flex-col items-center justify-center gap-2 pt-1">
            <a href="index.html" title="FreeZip-Tools Home" class="group flex flex-col items-center">
              <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-red-600 to-rose-500 text-white flex items-center justify-center shadow-lg shadow-red-500/25 ring-4 ring-red-500/10 dark:ring-red-500/20 group-hover:scale-105 group-hover:rotate-3 transition-transform duration-200">
                <i class="fa-solid fa-shapes text-2xl"></i>
              </div>
            </a>
            <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-red-50 dark:bg-red-950/50 border border-red-200/70 dark:border-red-900/50 text-[11px] font-mono font-bold text-red-600 dark:text-red-400">
              <i class="fa-solid fa-shapes text-[10px]"></i>
              <span>FREE<span class="text-red-500">ZIP-TOOLS</span></span>
            </div>
          </div>

          <!-- Title & Live Status -->
          <div class="space-y-1">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">
              SHA-256 Hash
            </h1>
            <p id="statusText" class="text-xs font-mono text-slate-500 dark:text-slate-400 break-words">
              Upload file or enter text to compute cryptographic hash
            </p>
          </div>

          <!-- Hidden File Input for File Hashing -->
          <input 
            type="file" 
            id="hashFileInput" 
            class="hidden" 
            onchange="handleFileUpload(event)"
          >

          <!-- 1. MAIN BUTTON: UPLOAD FILE TO HASH (Fixed Brand Red #E11D48, 54px Mobile Thumb Size) -->
          <div>
            <button 
              type="button"
              onclick="document.getElementById('hashFileInput').click()"
              class="w-full min-h-[54px] py-3.5 px-5 rounded-xl bg-[#E11D48] hover:bg-rose-700 active:scale-[0.98] text-white font-bold text-base shadow-md shadow-rose-500/25 flex items-center justify-center gap-2.5 transition-all cursor-pointer"
            >
              <i class="fa-solid fa-fingerprint text-lg"></i>
              <span>Upload File to Hash</span>
            </button>
          </div>

          <!-- Minimalist Interactive Hashing Studio Area -->
          <div class="border border-slate-200 dark:border-slate-800 rounded-xl bg-white/70 dark:bg-slate-900/60 p-3 text-left space-y-3">
            
            <!-- Input Controls (Mode Pill, Case Toggle & Quick Sample) -->
            <div class="flex items-center justify-between text-xs flex-wrap gap-1">
              <div class="flex items-center gap-1 font-mono text-[11px]">
                <button type="button" onclick="setMode('text')" id="modeTextBtn" class="px-2.5 py-0.5 rounded font-bold bg-[#E11D48] text-white transition-all">Text Input</button>
                <button type="button" onclick="toggleCase()" id="caseToggleBtn" class="px-2 py-0.5 rounded font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-all" title="Toggle Uppercase / Lowercase">lowercase</button>
              </div>

              <!-- Quick Sample Helper -->
              <button type="button" onclick="loadSampleText()" class="text-[10px] font-mono font-semibold text-red-500 hover:text-red-700 dark:hover:text-red-400">
                Sample
              </button>
            </div>

            <!-- Text / File Source Content Box -->
            <div class="relative">
              <textarea 
                id="sourceInput" 
                rows="3" 
                oninput="handleTextInput(this.value)"
                placeholder="Type or paste any text string here to compute SHA-256..."
                class="w-full p-2.5 text-xs font-mono rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-slate-800 dark:text-slate-200 placeholder-slate-400 focus:outline-none focus:border-red-500 transition-colors resize-y leading-relaxed"
                spellcheck="false"
              ></textarea>
            </div>

            <!-- Uploaded File Pill Indicator (if file uploaded) -->
            <div id="fileInfoBox" class="hidden flex items-center justify-between p-2 rounded-lg bg-slate-100/80 dark:bg-slate-800/60 text-xs font-mono">
              <div class="flex items-center gap-2 overflow-hidden">
                <i class="fa-solid fa-file text-red-500"></i>
                <span id="fileNameDisplay" class="truncate font-semibold text-slate-800 dark:text-slate-200">file.bin</span>
                <span id="fileSizeDisplay" class="text-slate-400 text-[10px] shrink-0">(0 KB)</span>
              </div>
              <button type="button" onclick="clearFile()" class="text-slate-400 hover:text-red-500 text-[11px] p-1">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>

            <!-- SHA-256 Hash Output Box with Dedicated Working Copy Button -->
            <div class="space-y-1.5 border-t border-slate-200 dark:border-slate-800 pt-2.5">
              <div class="flex items-center justify-between text-xs">
                <span class="font-bold text-slate-700 dark:text-slate-300 font-mono text-[11px] flex items-center gap-1.5">
                  <i class="fa-solid fa-shield-halved text-red-500 text-[10px]"></i>
                  <span>SHA-256 Digest:</span>
                </span>

                <!-- Dedicated Working Copy Button -->
                <button 
                  type="button" 
                  id="copyHashBtn"
                  onclick="copyHashOutput()"
                  title="Copy SHA-256 Hash"
                  class="text-[10px] font-mono font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 flex items-center gap-1 cursor-pointer"
                >
                  <i id="copyHashIcon" class="fa-regular fa-copy text-[10px]"></i>
                  <span id="copyHashText">Copy Hash</span>
                </button>
              </div>

              <!-- Output Textarea (64-character hex string) -->
              <div class="relative">
                <textarea 
                  id="hashOutput" 
                  rows="2" 
                  readonly 
                  placeholder="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
                  class="w-full p-2.5 text-xs font-mono font-bold rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-emerald-600 dark:text-emerald-400 focus:outline-none resize-none leading-relaxed break-all select-all"
                ></textarea>
              </div>

              <!-- Metrics: Bit Depth & Hex Char Count -->
              <div class="flex items-center justify-between text-[10px] font-mono text-slate-400 pt-0.5">
                <span id="bitLengthBadge">256 Bits &bull; 32 Bytes</span>
                <span id="charCountBadge">64 hex characters</span>
              </div>
            </div>

            <!-- Hash Verifier / Checksum Matcher -->
            <div class="space-y-1.5 border-t border-slate-200 dark:border-slate-800 pt-2.5">
              <div class="flex items-center justify-between text-xs font-mono">
                <span class="font-bold text-slate-700 dark:text-slate-300 text-[10px]">Verify / Compare Checksum:</span>
                <span id="matchStatusBadge" class="text-[10px] text-slate-400">Optional</span>
              </div>
              <input 
                type="text" 
                id="verifyInput" 
                oninput="verifyHash(this.value)"
                placeholder="Paste expected SHA-256 hash to verify match..."
                class="w-full px-2.5 py-1.5 text-[11px] font-mono rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-200 focus:outline-none focus:border-red-500 transition-colors"
                spellcheck="false"
              >
            </div>

          </div>

          <!-- 2 & 3. ACTION BUTTONS: DOWNLOAD & RESET (2-Column Thumb Grid) -->
          <div class="grid grid-cols-2 gap-2.5 sm:gap-3 pt-1">
            <button 
              id="downloadBtn"
              type="button"
              onclick="downloadHashFile()"
              disabled
              class="w-full min-h-[48px] py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] disabled:bg-slate-200 dark:disabled:bg-slate-800 disabled:text-slate-400 disabled:cursor-not-allowed text-white font-bold text-sm flex items-center justify-center gap-2 transition-all cursor-pointer shadow-sm"
            >
              <i class="fa-solid fa-download text-xs"></i>
              <span id="downloadBtnText">Download (.txt)</span>
            </button>

            <button 
              id="resetBtn"
              type="button"
              onclick="resetAll()"
              class="w-full min-h-[48px] py-3 px-4 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-[0.98] text-slate-700 dark:text-slate-200 font-bold text-sm flex items-center justify-center gap-2 transition-all cursor-pointer"
            >
              <i class="fa-solid fa-rotate-left text-xs"></i>
              <span>Reset</span>
            </button>
          </div>

        </div>
      </main>

      <!-- MOBILE SAFE-AREA FOOTER -->
      <footer class="safe-bottom border-t border-slate-200 dark:border-slate-800 px-4 pt-3 text-center text-[11px] font-mono text-slate-400">
        FreeZip-Tools &bull; 100% Client-Side SHA-256 Cryptographic Hash
      </footer>

    </div>
  </div>

  <!-- SHA-256 JAVASCRIPT LOGIC (Web Crypto API) -->
  <script>
    let isUppercase = false;
    let currentHash = '';
    let currentSourceType = 'text'; // 'text' or 'file'
    let currentFileName = 'hash.txt';
    let fileBuffer = null;

    // Helper: Format byte counts cleanly
    function formatBytes(bytes) {
      if (!bytes || bytes <= 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return (bytes / Math.pow(k, i)).toFixed(2) + ' ' + sizes[i];
    }

    // In-browser Web Crypto API Hashing Engine
    async function computeBufferSha256(buffer) {
      const digestBuffer = await crypto.subtle.digest('SHA-256', buffer);
      const hashArray = Array.from(new Uint8Array(digestBuffer));
      const hex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      return hex;
    }

    // Process Text Input
    async function handleTextInput(text) {
      currentSourceType = 'text';
      document.getElementById('fileInfoBox').classList.add('hidden');
      fileBuffer = null;

      if (!text) {
        currentHash = '';
        document.getElementById('hashOutput').value = '';
        document.getElementById('statusText').innerText = 'Upload file or enter text to compute cryptographic hash';
        document.getElementById('downloadBtn').disabled = true;
        verifyHash(document.getElementById('verifyInput').value);
        return;
      }

      const encoder = new TextEncoder();
      const data = encoder.encode(text);
      const rawHex = await computeBufferSha256(data);
      applyHashOutput(rawHex);

      document.getElementById('statusText').innerText = `Computed SHA-256 for ${text.length} character(s)`;
      document.getElementById('downloadBtn').disabled = false;
    }

    // Apply Hash Output to Textarea with case formatting
    function applyHashOutput(hex) {
      currentHash = hex;
      const formatted = isUppercase ? hex.toUpperCase() : hex.toLowerCase();
      document.getElementById('hashOutput').value = formatted;
      verifyHash(document.getElementById('verifyInput').value);
    }

    // Toggle Upper/Lower Case
    function toggleCase() {
      isUppercase = !isUppercase;
      const btn = document.getElementById('caseToggleBtn');
      btn.innerText = isUppercase ? 'UPPERCASE' : 'lowercase';
      btn.className = isUppercase 
        ? 'px-2 py-0.5 rounded font-bold bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-slate-200 transition-all'
        : 'px-2 py-0.5 rounded font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-all';

      if (currentHash) {
        applyHashOutput(currentHash);
      }
    }

    // 1. Upload File Handler
    async function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const status = document.getElementById('statusText');
      status.innerText = `Calculating SHA-256 for ${file.name}...`;

      try {
        currentSourceType = 'file';
        currentFileName = file.name;
        document.getElementById('sourceInput').value = '';

        fileBuffer = await file.arrayBuffer();
        const rawHex = await computeBufferSha256(fileBuffer);

        // Update File Info Pill
        document.getElementById('fileNameDisplay').innerText = file.name;
        document.getElementById('fileSizeDisplay').innerText = `(${formatBytes(file.size)})`;
        document.getElementById('fileInfoBox').classList.remove('hidden');

        applyHashOutput(rawHex);
        status.innerText = `Computed SHA-256 for ${file.name} (${formatBytes(file.size)})`;
        document.getElementById('downloadBtn').disabled = false;
      } catch (err) {
        console.error(err);
        status.innerText = 'Error reading file for hash.';
      }

      event.target.value = '';
    }

    // Clear Uploaded File
    function clearFile() {
      fileBuffer = null;
      currentSourceType = 'text';
      document.getElementById('fileInfoBox').classList.add('hidden');
      document.getElementById('sourceInput').value = '';
      currentHash = '';
      document.getElementById('hashOutput').value = '';
      document.getElementById('downloadBtn').disabled = true;
      document.getElementById('statusText').innerText = 'File removed. Enter text or upload another file.';
      verifyHash('');
    }

    // Quick Test Sample Text
    function loadSampleText() {
      const sample = "The quick brown fox jumps over the lazy dog";
      document.getElementById('sourceInput').value = sample;
      handleTextInput(sample);
    }

    // Checksum Comparator / Verifier
    function verifyHash(expected) {
      const badge = document.getElementById('matchStatusBadge');
      const cleanExpected = expected.trim().toLowerCase();
      const current = currentHash.toLowerCase();

      if (!cleanExpected) {
        badge.innerText = 'Optional';
        badge.className = 'text-[10px] text-slate-400';
        return;
      }

      if (!current) {
        badge.innerText = 'Waiting for hash...';
        badge.className = 'text-[10px] text-slate-400';
        return;
      }

      if (cleanExpected === current) {
        badge.innerHTML = '<span class="text-emerald-600 dark:text-emerald-400 font-bold flex items-center gap-1"><i class="fa-solid fa-check"></i> MATCH</span>';
      } else {
        badge.innerHTML = '<span class="text-rose-500 font-bold flex items-center gap-1"><i class="fa-solid fa-xmark"></i> MISMATCH</span>';
      }
    }

    // Dedicated Working Copy Button for SHA-256 Digest
    function copyHashOutput() {
      const output = document.getElementById('hashOutput');
      if (!output.value.trim()) return;

      copyTextToClipboard(output.value);
      const copyText = document.getElementById('copyHashText');
      const copyIcon = document.getElementById('copyHashIcon');

      copyText.innerText = 'Copied!';
      copyIcon.className = 'fa-solid fa-check text-[10px] text-emerald-500';

      setTimeout(() => {
        copyText.innerText = 'Copy Hash';
        copyIcon.className = 'fa-regular fa-copy text-[10px]';
      }, 1800);

      document.getElementById('statusText').innerText = 'Copied SHA-256 hash to clipboard!';
    }

    // Universal copy helper using execCommand
    function copyTextToClipboard(text) {
      const temp = document.createElement('textarea');
      temp.value = text;
      temp.style.position = 'fixed';
      temp.style.left = '-9999px';
      temp.style.top = '0';
      document.body.appendChild(temp);
      temp.focus();
      temp.select();
      try {
        document.execCommand('copy');
      } catch (e) {
        console.error('Copy failed');
      }
      document.body.removeChild(temp);
    }

    // 2. Download Hash (.txt) File
    function downloadHashFile() {
      if (!currentHash) return;

      const outputVal = isUppercase ? currentHash.toUpperCase() : currentHash.toLowerCase();
      let fileTitle = 'sha256-hash.txt';
      let content = '';

      if (currentSourceType === 'file') {
        fileTitle = `${currentFileName}.sha256.txt`;
        content = `# SHA-256 Checksum\nFile: ${currentFileName}\nSHA-256: ${outputVal}\n`;
      } else {
        const textSnippet = document.getElementById('sourceInput').value.slice(0, 80);
        content = `# SHA-256 Checksum\nInput: "${textSnippet}..."\nSHA-256: ${outputVal}\n`;
      }

      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileTitle;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      document.getElementById('statusText').innerText = `Downloaded ${fileTitle}!`;
    }

    // 3. Reset Handler
    function resetAll() {
      currentHash = '';
      currentSourceType = 'text';
      fileBuffer = null;
      isUppercase = false;

      document.getElementById('sourceInput').value = '';
      document.getElementById('hashOutput').value = '';
      document.getElementById('verifyInput').value = '';
      document.getElementById('fileInfoBox').classList.add('hidden');
      document.getElementById('matchStatusBadge').innerText = 'Optional';
      document.getElementById('matchStatusBadge').className = 'text-[10px] text-slate-400';
      document.getElementById('statusText').innerText = 'Upload file or enter text to compute cryptographic hash';
      document.getElementById('downloadBtn').disabled = true;

      const btn = document.getElementById('caseToggleBtn');
      btn.innerText = 'lowercase';
      btn.className = 'px-2 py-0.5 rounded font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-all';
    }

    // Theme Switcher Sync with localStorage
    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      const icon = document.getElementById('themeIcon');
      icon.className = isDark ? 'fa-solid fa-sun text-xs text-amber-400' : 'fa-solid fa-moon text-xs';
      localStorage.setItem('freezip_theme', isDark ? 'dark' : 'light');
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('freezip_theme') === 'dark') {
        document.documentElement.classList.add('dark');
        document.getElementById('themeIcon').className = 'fa-solid fa-sun text-xs text-amber-400';
      }
    });
  </script>
</body>
</html>
