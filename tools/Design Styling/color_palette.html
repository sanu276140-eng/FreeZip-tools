<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Color Palette — FreeZip</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    html, body {
      overscroll-behavior-y: none;
    }
    .wireframe-container {
      border-left: none;
      border-right: none;
    }
    @media (min-width: 640px) {
      .wireframe-container {
        border-left: 1.5px solid rgba(203, 213, 225, 0.8);
        border-right: 1.5px solid rgba(203, 213, 225, 0.8);
      }
      .dark .wireframe-container {
        border-left: 1.5px solid rgba(51, 65, 85, 0.7);
        border-right: 1.5px solid rgba(51, 65, 85, 0.7);
      }
    }
    .safe-bottom {
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
    }
    .swatch-card {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .swatch-card:hover {
      transform: translateY(-2px);
    }
  </style>
</head>

<body class="bg-white sm:bg-slate-100/70 dark:bg-[#0D131F] sm:dark:bg-[#070b12] text-slate-800 dark:text-slate-100 min-h-[100dvh] font-sans transition-colors duration-200 antialiased flex flex-col overflow-x-hidden select-none">

  <!-- MOBILE-FIRST OUTER WRAPPER -->
  <div class="w-full max-w-[1140px] mx-auto px-0 sm:px-6 md:px-10 flex-1 flex flex-col">

    <!-- MINIMAL WIREFRAME CONTAINER -->
    <div class="wireframe-container bg-white dark:bg-[#0D131F] flex-1 flex flex-col justify-between sm:shadow-sm">

      <!-- MOBILE-FIRST HEADER -->
      <header class="border-b border-slate-200 dark:border-slate-800 px-4 sm:px-6 md:px-8 h-14 sm:h-16 flex items-center justify-between gap-2 sticky top-0 z-30 bg-white/95 dark:bg-[#0D131F]/95 backdrop-blur-md">
        <a href="https://www.freezip.site/" class="flex items-center gap-2.5 font-bold tracking-tight text-slate-900 dark:text-white group">
          <span class="w-8 h-8 rounded-lg bg-red-500 text-white flex items-center justify-center text-xs shadow-sm shadow-red-500/40 group-hover:rotate-6 transition-transform">
            <i class="fa-solid fa-shapes"></i>
          </span>
          <span class="text-base font-extrabold uppercase tracking-wide">
            Free<span class="text-red-500">Zip-Tools</span>
          </span>
        </a>

        <div class="flex items-center gap-2 shrink-0">
          <a href="https://www.freezip.site/" class="h-10 px-3 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-300 bg-slate-100/80 dark:bg-slate-800/60 hover:text-red-500 active:scale-95 transition-all flex items-center gap-1.5">
            <i class="fa-solid fa-arrow-left text-[11px]"></i>
            <span>Home</span>
          </a>
          <button onclick="toggleTheme()" aria-label="Toggle Theme" class="w-10 h-10 rounded-xl border border-slate-200 dark:border-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300 active:scale-95 transition-all">
            <i id="themeIcon" class="fa-solid fa-moon text-sm"></i>
          </button>
        </div>
      </header>

      <!-- MOBILE-FIRST MAIN WORKSPACE -->
      <main class="flex-1 flex flex-col justify-center px-4 py-5 sm:p-8 md:p-12 w-full">
        <div class="w-full max-w-md mx-auto border border-slate-200/90 dark:border-slate-800 rounded-2xl bg-slate-50/70 dark:bg-[#111827]/80 p-5 sm:p-7 text-center space-y-5 shadow-sm">

          <!-- Website Logo & Brand Identity Badge -->
          <div class="flex flex-col items-center justify-center gap-2 pt-1">
            <a href="index.html" title="FreeZip-Tools Home" class="group flex flex-col items-center">
              <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-red-600 to-rose-500 text-white flex items-center justify-center shadow-lg shadow-red-500/25 ring-4 ring-red-500/10 dark:ring-red-500/20 group-hover:scale-105 group-hover:rotate-3 transition-transform duration-200">
                <i class="fa-solid fa-shapes text-2xl"></i>
              </div>
            </a>
            <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-red-50 dark:bg-red-950/50 border border-red-200/70 dark:border-red-900/50 text-[11px] font-mono font-bold text-red-600 dark:text-red-400">
              <i class="fa-solid fa-shapes text-[10px]"></i>
              <span>FREE<span class="text-red-500">ZIP-TOOLS</span></span>
            </div>
          </div>

          <!-- Title & Live Status -->
          <div class="space-y-1">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">
              Color Palette
            </h1>
            <p id="statusText" class="text-xs font-mono text-slate-500 dark:text-slate-400 break-words">
              Upload image or roll fresh harmonic schemes
            </p>
          </div>

          <!-- Hidden File Input for Image Palette Extraction -->
          <input 
            type="file" 
            id="imagePaletteInput" 
            accept="image/*" 
            class="hidden" 
            onchange="handleImageUpload(event)"
          >

          <!-- 1. MAIN BUTTON: UPLOAD IMAGE (Fixed Brand Red #E11D48, 54px Mobile Thumb Size) -->
          <div>
            <button 
              type="button"
              onclick="document.getElementById('imagePaletteInput').click()"
              class="w-full min-h-[54px] py-3.5 px-5 rounded-xl bg-[#E11D48] hover:bg-rose-700 active:scale-[0.98] text-white font-bold text-base shadow-md shadow-rose-500/25 flex items-center justify-center gap-2.5 transition-all cursor-pointer"
            >
              <i class="fa-solid fa-palette text-lg"></i>
              <span>Upload Image to Extract Palette</span>
            </button>
          </div>

          <!-- Minimalist Interactive Palette Area -->
          <div class="border border-slate-200 dark:border-slate-800 rounded-xl bg-white/70 dark:bg-slate-900/60 p-3 text-left space-y-3">
            
            <!-- Harmony Modes & Roll Button -->
            <div class="flex items-center justify-between text-xs flex-wrap gap-1">
              <div class="flex items-center gap-1 font-mono text-[11px] flex-wrap">
                <button type="button" onclick="setHarmony('random')" id="btnHarmRandom" class="px-2 py-0.5 rounded font-bold bg-[#E11D48] text-white transition-all">Random</button>
                <button type="button" onclick="setHarmony('complementary')" id="btnHarmComp" class="px-2 py-0.5 rounded font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-all">Complement</button>
                <button type="button" onclick="setHarmony('analogous')" id="btnHarmAnalog" class="px-2 py-0.5 rounded font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-all">Analogous</button>
                <button type="button" onclick="setHarmony('monochrome')" id="btnHarmMono" class="px-2 py-0.5 rounded font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-all">Mono</button>
              </div>

              <!-- Roll Action Button -->
              <button 
                type="button" 
                onclick="generateNewPalette()"
                class="px-2.5 py-1 text-[11px] font-mono font-bold bg-slate-900 hover:bg-slate-800 dark:bg-slate-100 dark:hover:bg-white text-white dark:text-slate-900 rounded-lg active:scale-95 transition-all flex items-center gap-1.5"
                title="Generate fresh palette (or Press Spacebar)"
              >
                <i class="fa-solid fa-dice text-[11px]"></i>
                <span>Roll</span>
              </button>
            </div>

            <!-- 5 Interactive Swatches Container -->
            <div id="swatchesContainer" class="grid grid-cols-5 gap-1.5 sm:gap-2">
              <!-- Swatches injected via JavaScript -->
            </div>

            <!-- Quick Export Format Selector & Copy Action -->
            <div class="flex items-center justify-between text-xs pt-1 border-t border-slate-200 dark:border-slate-800">
              <div class="flex items-center gap-1 font-mono text-[11px]">
                <span class="text-slate-400 text-[10px]">Format:</span>
                <button type="button" onclick="setExportFormat('css')" id="btnFmtCss" class="px-2 py-0.5 rounded font-bold bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-slate-200">CSS</button>
                <button type="button" onclick="setExportFormat('json')" id="btnFmtJson" class="px-2 py-0.5 rounded font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200">JSON</button>
                <button type="button" onclick="setExportFormat('hex')" id="btnFmtHex" class="px-2 py-0.5 rounded font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200">HEX</button>
              </div>

              <!-- Quick 1-Tap Copy -->
              <button type="button" onclick="copyPaletteCode()" id="copyBtn" class="text-[10px] font-mono font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 flex items-center gap-1">
                <i class="fa-regular fa-copy text-[10px]"></i>
                <span id="copyBtnText">Copy All</span>
              </button>
            </div>

            <!-- Source Image Thumbnail (if uploaded) -->
            <div id="imagePreviewBox" class="hidden flex items-center justify-between p-2 rounded-lg bg-slate-100/80 dark:bg-slate-800/60 text-xs">
              <div class="flex items-center gap-2 overflow-hidden">
                <img id="imageThumb" alt="Uploaded Thumbnail" class="w-8 h-8 rounded object-cover border border-slate-300 dark:border-slate-700">
                <span id="imageNameDisplay" class="font-mono text-[11px] truncate text-slate-700 dark:text-slate-300">image.jpg</span>
              </div>
              <span class="font-mono text-[10px] text-emerald-600 dark:text-emerald-400 font-bold shrink-0">Extracted</span>
            </div>

          </div>

          <!-- 2 & 3. ACTION BUTTONS: DOWNLOAD & RESET (2-Column Thumb Grid) -->
          <div class="grid grid-cols-2 gap-2.5 sm:gap-3 pt-1">
            <button 
              id="downloadBtn"
              type="button"
              onclick="downloadPaletteFile()"
              class="w-full min-h-[48px] py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] disabled:bg-slate-200 dark:disabled:bg-slate-800 disabled:text-slate-400 disabled:cursor-not-allowed text-white font-bold text-sm flex items-center justify-center gap-2 transition-all"
            >
              <i class="fa-solid fa-download text-xs"></i>
              <span id="downloadBtnText">Download</span>
            </button>

            <button 
              id="resetBtn"
              type="button"
              onclick="resetAll()"
              class="w-full min-h-[48px] py-3 px-4 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-[0.98] disabled:opacity-40 disabled:cursor-not-allowed text-slate-700 dark:text-slate-200 font-bold text-sm flex items-center justify-center gap-2 transition-all"
            >
              <i class="fa-solid fa-rotate-left text-xs"></i>
              <span>Reset</span>
            </button>
          </div>

        </div>
      </main>

      <!-- MOBILE SAFE-AREA FOOTER -->
      <footer class="safe-bottom border-t border-slate-200 dark:border-slate-800 px-4 pt-3 text-center text-[11px] font-mono text-slate-400">
        FreeZip-Tools &bull; 100% Color Palette
      </footer>

    </div>
  </div>

  <!-- COLOR PALETTE JAVASCRIPT LOGIC -->
  <script>
    let activeHarmony = 'random'; // 'random', 'complementary', 'analogous', 'monochrome'
    let exportFormat = 'css'; // 'css', 'json', 'hex'
    let isExtracted = false;

    // Palette State: 5 Colors with individual lock states
    let palette = [
      { hex: '#E11D48', locked: false },
      { hex: '#F43F5E', locked: false },
      { hex: '#FB7185', locked: false },
      { hex: '#FDA4AF', locked: false },
      { hex: '#FFF1F2', locked: false }
    ];

    // Helper: Convert HSL to Hex
    function hslToHex(h, s, l) {
      l /= 100;
      const a = (s * Math.min(l, 1 - l)) / 100;
      const f = n => {
        const k = (n + h / 30) % 12;
        const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
        return Math.round(255 * color).toString(16).padStart(2, '0');
      };
      return `#${f(0)}${f(8)}${f(4)}`.toUpperCase();
    }

    // Helper: Random Integer
    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // Generate colors based on harmony mode
    function generateNewPalette() {
      const baseHue = getRandomInt(0, 360);
      const baseSat = getRandomInt(55, 85);

      if (activeHarmony === 'random') {
        palette.forEach(color => {
          if (!color.locked) {
            const h = getRandomInt(0, 360);
            const s = getRandomInt(50, 90);
            const l = getRandomInt(30, 80);
            color.hex = hslToHex(h, s, l);
          }
        });
      } else if (activeHarmony === 'complementary') {
        const compHue = (baseHue + 180) % 360;
        const hues = [baseHue, baseHue, (baseHue + 25) % 360, compHue, (compHue + 20) % 360];
        const lights = [28, 48, 68, 52, 74];
        palette.forEach((color, idx) => {
          if (!color.locked) {
            color.hex = hslToHex(hues[idx], baseSat, lights[idx]);
          }
        });
      } else if (activeHarmony === 'analogous') {
        palette.forEach((color, idx) => {
          if (!color.locked) {
            const h = (baseHue + (idx * 25)) % 360;
            const l = 35 + (idx * 11);
            color.hex = hslToHex(h, baseSat, l);
          }
        });
      } else if (activeHarmony === 'monochrome') {
        palette.forEach((color, idx) => {
          if (!color.locked) {
            const l = 20 + (idx * 16);
            color.hex = hslToHex(baseHue, baseSat, l);
          }
        });
      }

      isExtracted = false;
      document.getElementById('imagePreviewBox').classList.add('hidden');
      document.getElementById('statusText').innerText = `Harmonic palette generated (${activeHarmony})`;
      renderSwatches();
    }

    // Set harmony mode
    function setHarmony(harmony) {
      activeHarmony = harmony;
      const btns = [
        document.getElementById('btnHarmRandom'),
        document.getElementById('btnHarmComp'),
        document.getElementById('btnHarmAnalog'),
        document.getElementById('btnHarmMono')
      ];

      btns.forEach(b => {
        b.className = 'px-2 py-0.5 rounded font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-all';
      });

      if (harmony === 'random') btns[0].className = 'px-2 py-0.5 rounded font-bold bg-[#E11D48] text-white transition-all';
      if (harmony === 'complementary') btns[1].className = 'px-2 py-0.5 rounded font-bold bg-[#E11D48] text-white transition-all';
      if (harmony === 'analogous') btns[2].className = 'px-2 py-0.5 rounded font-bold bg-[#E11D48] text-white transition-all';
      if (harmony === 'monochrome') btns[3].className = 'px-2 py-0.5 rounded font-bold bg-[#E11D48] text-white transition-all';

      generateNewPalette();
    }

    // Toggle individual lock state
    function toggleLock(index, event) {
      event.stopPropagation();
      palette[index].locked = !palette[index].locked;
      renderSwatches();
    }

    // Copy single color hex with active button feedback
    function copyColor(hex, idx, event) {
      if (event) event.stopPropagation();
      copyTextToClipboard(hex);
      document.getElementById('statusText').innerText = `Copied ${hex} to clipboard!`;

      // Update specific button visual feedback
      const btn = document.getElementById(`copyBtn_${idx}`);
      const label = document.getElementById(`copyLabel_${idx}`);
      const icon = document.getElementById(`copyIcon_${idx}`);

      if (btn && label && icon) {
        btn.classList.add('bg-emerald-600', 'text-white', 'border-emerald-600');
        btn.classList.remove('bg-slate-100', 'dark:bg-slate-800', 'text-slate-700', 'dark:text-slate-200');
        icon.className = 'fa-solid fa-check text-[10px]';
        label.innerText = 'Copied!';

        setTimeout(() => {
          btn.classList.remove('bg-emerald-600', 'text-white', 'border-emerald-600');
          btn.classList.add('bg-slate-100', 'dark:bg-slate-800', 'text-slate-700', 'dark:text-slate-200');
          icon.className = 'fa-regular fa-copy text-[10px]';
          label.innerText = 'Copy';
        }, 1500);
      }
    }

    // Render 5 Swatches into DOM with individual Copy buttons
    function renderSwatches() {
      const container = document.getElementById('swatchesContainer');
      container.innerHTML = palette.map((color, idx) => {
        // Luminance calculation for text contrast
        const hex = color.hex.replace('#', '');
        const r = parseInt(hex.substring(0, 2), 16);
        const g = parseInt(hex.substring(2, 4), 16);
        const b = parseInt(hex.substring(4, 6), 16);
        const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
        const textColor = yiq >= 128 ? '#0f172a' : '#ffffff';

        return `
          <div class="flex flex-col items-center gap-1.5">
            <!-- Swatch Color Box -->
            <div 
              onclick="copyColor('${color.hex}', ${idx}, event)" 
              title="Click to copy ${color.hex}"
              class="swatch-card group relative w-full h-24 sm:h-28 rounded-xl flex flex-col justify-between p-1.5 shadow-sm border border-black/10 dark:border-white/10 cursor-pointer"
              style="background-color: ${color.hex}; color: ${textColor};"
            >
              <!-- Lock Button -->
              <button 
                type="button" 
                onclick="toggleLock(${idx}, event)"
                class="self-end p-1 rounded-md bg-black/25 hover:bg-black/40 text-white backdrop-blur-xs transition-all active:scale-90"
                title="${color.locked ? 'Unlock Color' : 'Lock Color'}"
              >
                <i class="fa-solid ${color.locked ? 'fa-lock text-amber-300' : 'fa-lock-open text-[10px] opacity-80 group-hover:opacity-100'}"></i>
              </button>

              <div class="text-center font-mono font-bold text-[9px] sm:text-[10px] tracking-tight truncate opacity-85">
                #${idx + 1}
              </div>
            </div>

            <!-- Bottom Hex Code & Dedicated Copy Button -->
            <div class="w-full flex flex-col items-center gap-1">
              <span class="font-mono font-bold text-[10px] sm:text-[11px] text-slate-800 dark:text-slate-200 tracking-tight truncate">
                ${color.hex}
              </span>

              <button 
                type="button"
                id="copyBtn_${idx}"
                onclick="copyColor('${color.hex}', ${idx}, event)"
                title="Copy ${color.hex}"
                class="w-full py-1 px-1 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-[10px] font-mono font-semibold flex items-center justify-center gap-1 border border-slate-200 dark:border-slate-700 active:scale-95 transition-all cursor-pointer"
              >
                <i id="copyIcon_${idx}" class="fa-regular fa-copy text-[10px]"></i>
                <span id="copyLabel_${idx}">Copy</span>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Set export format
    function setExportFormat(fmt) {
      exportFormat = fmt;
      const bCss = document.getElementById('btnFmtCss');
      const bJson = document.getElementById('btnFmtJson');
      const bHex = document.getElementById('btnFmtHex');

      [bCss, bJson, bHex].forEach(b => {
        b.className = 'px-2 py-0.5 rounded font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200';
      });

      if (fmt === 'css') bCss.className = 'px-2 py-0.5 rounded font-bold bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-slate-200';
      if (fmt === 'json') bJson.className = 'px-2 py-0.5 rounded font-bold bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-slate-200';
      if (fmt === 'hex') bHex.className = 'px-2 py-0.5 rounded font-bold bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-slate-200';
    }

    // Export content string builder
    function buildExportContent() {
      if (exportFormat === 'css') {
        return `:root {\n` + palette.map((c, i) => `  --color-${i + 1}: ${c.hex};`).join('\n') + `\n}`;
      } else if (exportFormat === 'json') {
        const obj = {
          paletteName: "FreeZip-Tools Palette",
          colors: palette.map((c, i) => ({ index: i + 1, hex: c.hex }))
        };
        return JSON.stringify(obj, null, 2);
      } else {
        return palette.map(c => c.hex).join(', ');
      }
    }

    // Universal copy helper
    function copyTextToClipboard(text) {
      const temp = document.createElement('textarea');
      temp.value = text;
      temp.style.position = 'fixed';
      temp.style.left = '-9999px';
      temp.style.top = '0';
      document.body.appendChild(temp);
      temp.focus();
      temp.select();
      try {
        document.execCommand('copy');
      } catch (e) {
        console.error('Copy failed');
      }
      document.body.removeChild(temp);
    }

    // Copy entire palette in active format
    function copyPaletteCode() {
      const content = buildExportContent();
      copyTextToClipboard(content);
      const copyBtnText = document.getElementById('copyBtnText');
      copyBtnText.innerText = 'Copied!';
      setTimeout(() => {
        copyBtnText.innerText = 'Copy All';
      }, 1800);
      document.getElementById('statusText').innerText = `Copied ${exportFormat.toUpperCase()} to clipboard!`;
    }

    // 1. Upload Image to Extract Dominant Colors
    async function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const status = document.getElementById('statusText');
      status.innerText = `Extracting colors from ${file.name}...`;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          // Downscale to canvas for fast pixel sampling
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const maxDim = 80;
          const scale = Math.min(maxDim / img.width, maxDim / img.height, 1);
          canvas.width = Math.floor(img.width * scale);
          canvas.height = Math.floor(img.height * scale);

          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

          // Simple Color Quantization
          const colorMap = {};
          for (let i = 0; i < imgData.length; i += 16) {
            const r = Math.round(imgData[i] / 24) * 24;
            const g = Math.round(imgData[i + 1] / 24) * 24;
            const b = Math.round(imgData[i + 2] / 24) * 24;
            const key = `${r},${g},${b}`;
            colorMap[key] = (colorMap[key] || 0) + 1;
          }

          // Sort dominant colors by frequency
          const sorted = Object.keys(colorMap).sort((a, b) => colorMap[b] - colorMap[a]);
          const extractedHexes = [];

          for (const k of sorted) {
            const [r, g, b] = k.split(',').map(Number);
            const hex = `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`.toUpperCase();
            if (!extractedHexes.includes(hex)) {
              extractedHexes.push(hex);
            }
            if (extractedHexes.length >= 5) break;
          }

          // Fallback if image has fewer colors
          while (extractedHexes.length < 5) {
            extractedHexes.push(hslToHex(getRandomInt(0, 360), 70, 50));
          }

          extractedHexes.forEach((hex, idx) => {
            if (!palette[idx].locked) {
              palette[idx].hex = hex;
            }
          });

          // Show Thumbnail
          document.getElementById('imageThumb').src = e.target.result;
          document.getElementById('imageNameDisplay').innerText = file.name;
          document.getElementById('imagePreviewBox').classList.remove('hidden');

          isExtracted = true;
          status.innerText = `Extracted 5 dominant colors from ${file.name}!`;
          renderSwatches();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
      event.target.value = '';
    }

    // 2. Download Palette File
    function downloadPaletteFile() {
      const content = buildExportContent();
      const ext = exportFormat === 'css' ? 'css' : (exportFormat === 'json' ? 'json' : 'txt');
      const mime = exportFormat === 'json' ? 'application/json' : 'text/plain';

      const blob = new Blob([content], { type: `${mime};charset=utf-8` });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `palette.${ext}`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      document.getElementById('statusText').innerText = `Downloaded palette.${ext}!`;
    }

    // 3. Reset Palette Handler
    function resetAll() {
      palette = [
        { hex: '#E11D48', locked: false },
        { hex: '#F43F5E', locked: false },
        { hex: '#FB7185', locked: false },
        { hex: '#FDA4AF', locked: false },
        { hex: '#FFF1F2', locked: false }
      ];
      isExtracted = false;
      document.getElementById('imagePreviewBox').classList.add('hidden');
      document.getElementById('statusText').innerText = 'Palette reset to default';
      setHarmony('random');
      renderSwatches();
    }

    // Keyboard Shortcut: Spacebar rolls fresh palette
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
        e.preventDefault();
        generateNewPalette();
      }
    });

    // Minimal Theme Switcher (Syncs with localStorage)
    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      const icon = document.getElementById('themeIcon');
      icon.className = isDark ? 'fa-solid fa-sun text-xs text-amber-400' : 'fa-solid fa-moon text-xs';
      localStorage.setItem('freezip_theme', isDark ? 'dark' : 'light');
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('freezip_theme') === 'dark') {
        document.documentElement.classList.add('dark');
        document.getElementById('themeIcon').className = 'fa-solid fa-sun text-xs text-amber-400';
      }
      renderSwatches();
    });
  </script>
</body>
</html>
