<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Box Shadow Generator — FreeZip-Tools (Minimalist)</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    html, body {
      overscroll-behavior-y: none;
    }
    .wireframe-container {
      border-left: none;
      border-right: none;
    }
    @media (min-width: 640px) {
      .wireframe-container {
        border-left: 1.5px solid rgba(203, 213, 225, 0.8);
        border-right: 1.5px solid rgba(203, 213, 225, 0.8);
      }
      .dark .wireframe-container {
        border-left: 1.5px solid rgba(51, 65, 85, 0.7);
        border-right: 1.5px solid rgba(51, 65, 85, 0.7);
      }
    }
    .safe-bottom {
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
    }
    /* Color picker native styling */
    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }
    input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 6px;
    }
    /* Range Slider Styling */
    input[type="range"] {
      accent-color: #E11D48;
    }
    /* Checkerboard backdrop for contrast preview */
    .checkerboard-bg {
      background-image: linear-gradient(45deg, #e2e8f0 25%, transparent 25%), 
                        linear-gradient(-45deg, #e2e8f0 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #e2e8f0 75%), 
                        linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    }
    .dark .checkerboard-bg {
      background-image: linear-gradient(45deg, #1e293b 25%, transparent 25%), 
                        linear-gradient(-45deg, #1e293b 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #1e293b 75%), 
                        linear-gradient(-45deg, transparent 75%, #1e293b 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    }
  </style>
</head>

  <!-- BOX SHADOW JAVASCRIPT LOGIC -->
  <script>
    let activeLayerIndex = 0;
    let previewBackground = 'light'; // 'light', 'checker', 'dark'

    // Layers State
    let layers = [
      {
        x: 0,
        y: 12,
        blur: 24,
        spread: -4,
        color: '#000000',
        opacity: 0.18,
        inset: false
      }
    ];

    // Convert Hex + Opacity to RGBA
    function hexToRgba(hex, alpha) {
      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      const r = parseInt(c.substring(0, 2), 16) || 0;
      const g = parseInt(c.substring(2, 4), 16) || 0;
      const b = parseInt(c.substring(4, 6), 16) || 0;
      return `rgba(${r}, ${g}, ${b}, ${parseFloat(alpha.toFixed(2))})`;
    }

    // Build Single Layer Shadow CSS Fragment
    function buildLayerString(layer) {
      const insetStr = layer.inset ? 'inset ' : '';
      const colorStr = hexToRgba(layer.color, layer.opacity);
      return `${insetStr}${layer.x}px ${layer.y}px ${layer.blur}px ${layer.spread}px ${colorStr}`;
    }

    // Build Complete Box Shadow Value
    function buildFullShadowValue() {
      return layers.map(buildLayerString).join(', ');
    }

    // Update Live UI, Preview Box & Output Textarea
    function updateUI() {
      const shadowValue = buildFullShadowValue();
      const previewEl = document.getElementById('shadowPreviewElement');
      const cssOutput = document.getElementById('cssOutput');
      const statusText = document.getElementById('statusText');
      const layerBadge = document.getElementById('layerCountBadge');

      previewEl.style.boxShadow = shadowValue;
      previewEl.style.webkitBoxShadow = shadowValue;

      cssOutput.value = `box-shadow: ${shadowValue};\n-webkit-box-shadow: ${shadowValue};`;
      statusText.innerText = `Active: ${layers.length} shadow layer(s) configured`;
      layerBadge.innerText = layers.length;

      renderTabs();
      syncActiveLayerSliders();
    }

    // Render Layer Tabs
    function renderTabs() {
      const container = document.getElementById('layerTabsContainer');
      const addBtn = document.getElementById('addLayerBtn');
      addBtn.style.display = layers.length < 3 ? 'inline-flex' : 'none';

      container.innerHTML = layers.map((layer, idx) => `
        <div class="flex items-center">
          <button 
            type="button" 
            onclick="selectLayer(${idx})" 
            class="px-2.5 py-1 rounded-l-md font-bold text-[10px] transition-all ${
              idx === activeLayerIndex 
                ? 'bg-[#E11D48] text-white shadow-xs' 
                : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
            }"
          >
            Layer ${idx + 1}
          </button>
          ${
            layers.length > 1 ? `
              <button 
                type="button" 
                onclick="removeLayer(${idx}, event)" 
                title="Delete layer" 
                class="px-1.5 py-1 rounded-r-md text-[10px] ${
                  idx === activeLayerIndex 
                    ? 'bg-[#BE123C] text-white' 
                    : 'bg-slate-200 dark:bg-slate-700 text-slate-500 hover:text-red-500'
                }"
              >
                &times;
              </button>
            ` : ''
          }
        </div>
      `).join('');
    }

    // Select Active Layer
    function selectLayer(idx) {
      activeLayerIndex = idx;
      updateUI();
    }

    // Add New Shadow Layer (up to 3)
    function addShadowLayer() {
      if (layers.length >= 3) return;
      layers.push({
        x: 0,
        y: 4,
        blur: 10,
        spread: 0,
        color: '#000000',
        opacity: 0.12,
        inset: false
      });
      activeLayerIndex = layers.length - 1;
      updateUI();
    }

    // Remove Shadow Layer
    function removeLayer(idx, event) {
      if (event) event.stopPropagation();
      if (layers.length <= 1) return;
      layers.splice(idx, 1);
      if (activeLayerIndex >= layers.length) activeLayerIndex = layers.length - 1;
      updateUI();
    }

    // Sync Controls with Active Layer Values
    function syncActiveLayerSliders() {
      const cur = layers[activeLayerIndex];
      if (!cur) return;

      document.getElementById('rangeX').value = cur.x;
      document.getElementById('valX').innerText = `${cur.x}px`;

      document.getElementById('rangeY').value = cur.y;
      document.getElementById('valY').innerText = `${cur.y}px`;

      document.getElementById('rangeBlur').value = cur.blur;
      document.getElementById('valBlur').innerText = `${cur.blur}px`;

      document.getElementById('rangeSpread').value = cur.spread;
      document.getElementById('valSpread').innerText = `${cur.spread}px`;

      document.getElementById('layerColorPicker').value = cur.color;
      document.getElementById('layerHexBadge').innerText = cur.color.toUpperCase();

      const pct = Math.round(cur.opacity * 100);
      document.getElementById('rangeOpacity').value = pct;
      document.getElementById('valOpacity').innerText = `${pct}%`;

      const insetBtn = document.getElementById('insetToggleBtn');
      if (cur.inset) {
        insetBtn.className = 'px-2 py-1 text-[10px] font-mono font-bold rounded-md bg-[#E11D48] text-white active:scale-95 transition-all';
      } else {
        insetBtn.className = 'px-2 py-1 text-[10px] font-mono font-semibold rounded-md border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 active:scale-95 transition-all';
      }
    }

    // Update Property for Active Layer
    function updateActiveLayer(prop, val) {
      const cur = layers[activeLayerIndex];
      if (!cur) return;

      if (prop === 'x' || prop === 'y' || prop === 'blur' || prop === 'spread') {
        cur[prop] = parseInt(val, 10) || 0;
      } else if (prop === 'color') {
        cur.color = val;
      } else if (prop === 'opacity') {
        cur.opacity = Math.max(0, Math.min(1, parseInt(val, 10) / 100));
      }

      updateUI();
    }

    // Toggle Inset
    function toggleInset() {
      const cur = layers[activeLayerIndex];
      if (!cur) return;
      cur.inset = !cur.inset;
      updateUI();
    }

    // Switch Preview Background (Light, Checkerboard, Dark)
    function setPreviewBg(bg) {
      previewBackground = bg;
      const stage = document.getElementById('previewStage');
      const bLight = document.getElementById('bgLightBtn');
      const bCheck = document.getElementById('bgCheckerBtn');
      const bDark = document.getElementById('bgDarkBtn');

      [bLight, bCheck, bDark].forEach(b => {
        b.className = 'px-2 py-0.5 rounded text-slate-400 hover:text-slate-700 dark:hover:text-slate-200';
      });

      stage.classList.remove('checkerboard-bg', 'bg-white', 'bg-slate-900');

      if (bg === 'light') {
        bLight.className = 'px-2 py-0.5 rounded bg-white dark:bg-slate-800 shadow-xs border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 font-bold';
        stage.classList.add('bg-white');
      } else if (bg === 'checker') {
        bCheck.className = 'px-2 py-0.5 rounded bg-white dark:bg-slate-800 shadow-xs border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 font-bold';
        stage.classList.add('checkerboard-bg');
      } else {
        bDark.className = 'px-2 py-0.5 rounded bg-white dark:bg-slate-800 shadow-xs border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 font-bold';
        stage.classList.add('bg-slate-900');
      }
    }

    // Dedicated Copy Single Layer CSS with visual feedback
    function copyActiveLayerCss() {
      const cur = layers[activeLayerIndex];
      if (!cur) return;

      const layerCss = `box-shadow: ${buildLayerString(cur)};`;
      copyTextToClipboard(layerCss);

      const btn = document.getElementById('copyLayerBtn');
      const label = document.getElementById('copyLayerLabel');
      const icon = document.getElementById('copyLayerIcon');

      btn.classList.add('bg-emerald-600', 'text-white', 'border-emerald-600');
      btn.classList.remove('bg-slate-100', 'dark:bg-slate-800', 'text-slate-700', 'dark:text-slate-200');
      icon.className = 'fa-solid fa-check text-[9px]';
      label.innerText = 'Copied!';

      setTimeout(() => {
        btn.classList.remove('bg-emerald-600', 'text-white', 'border-emerald-600');
        btn.classList.add('bg-slate-100', 'dark:bg-slate-800', 'text-slate-700', 'dark:text-slate-200');
        icon.className = 'fa-regular fa-copy text-[9px]';
        label.innerText = 'Copy';
      }, 1500);

      document.getElementById('statusText').innerText = `Copied Layer ${activeLayerIndex + 1} CSS!`;
    }

    // Copy Full Box-Shadow CSS Code
    function copyCssCode() {
      const code = document.getElementById('cssOutput').value;
      if (!code.trim()) return;

      copyTextToClipboard(code);
      const copyText = document.getElementById('copyCssText');
      const copyIcon = document.getElementById('copyCssIcon');

      copyText.innerText = 'Copied!';
      copyIcon.className = 'fa-solid fa-check text-[10px] text-emerald-500';

      setTimeout(() => {
        copyText.innerText = 'Copy CSS';
        copyIcon.className = 'fa-regular fa-copy text-[10px]';
      }, 1800);

      document.getElementById('statusText').innerText = 'Copied complete box-shadow CSS!';
    }

    // Clipboard copy helper using execCommand for sandbox iframe reliability
    function copyTextToClipboard(text) {
      const temp = document.createElement('textarea');
      temp.value = text;
      temp.style.position = 'fixed';
      temp.style.left = '-9999px';
      temp.style.top = '0';
      document.body.appendChild(temp);
      temp.focus();
      temp.select();
      try {
        document.execCommand('copy');
      } catch (e) {
        console.error('Copy failed');
      }
      document.body.removeChild(temp);
    }

    // Roll Random Shadow Scheme
    function generateRandomShadow() {
      const numLayers = Math.floor(Math.random() * 2) + 1; // 1 or 2 layers
      layers = [];

      for (let i = 0; i < numLayers; i++) {
        const x = Math.floor((Math.random() - 0.5) * 30);
        const y = Math.floor(Math.random() * 25) + 2;
        const blur = Math.floor(Math.random() * 35) + 6;
        const spread = Math.floor((Math.random() - 0.5) * 12);
        const opacity = Math.round((Math.random() * 0.25 + 0.08) * 100) / 100;
        
        // Randomly pick a color tint (neutral black or vibrant)
        const isColored = Math.random() > 0.6;
        const color = isColored 
          ? '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0')
          : '#000000';

        layers.push({
          x,
          y,
          blur,
          spread,
          color,
          opacity,
          inset: false
        });
      }

      activeLayerIndex = 0;
      updateUI();
    }

    // Load Curated Presets
    function loadPreset(name) {
      if (name === 'soft') {
        layers = [
          { x: 0, y: 10, blur: 25, spread: -5, color: '#000000', opacity: 0.10, inset: false },
          { x: 0, y: 20, blur: 48, spread: -8, color: '#000000', opacity: 0.08, inset: false }
        ];
      } else if (name === 'elevation') {
        layers = [
          { x: 0, y: 1, blur: 3, spread: 0, color: '#000000', opacity: 0.12, inset: false },
          { x: 0, y: 12, blur: 24, spread: -4, color: '#000000', opacity: 0.16, inset: false }
        ];
      } else if (name === 'neon') {
        layers = [
          { x: 0, y: 0, blur: 20, spread: 2, color: '#E11D48', opacity: 0.50, inset: false },
          { x: 0, y: 0, blur: 40, spread: 8, color: '#FB7185', opacity: 0.30, inset: false }
        ];
      } else if (name === 'inner') {
        layers = [
          { x: 4, y: 4, blur: 8, spread: 0, color: '#000000', opacity: 0.18, inset: true },
          { x: -4, y: -4, blur: 8, spread: 0, color: '#ffffff', opacity: 0.70, inset: true }
        ];
      }

      activeLayerIndex = 0;
      updateUI();
    }

    // Download CSS File
    function downloadShadowCss() {
      const shadowValue = buildFullShadowValue();
      const content = `/* Generated by FreeZip-Tools Box Shadow Generator */\n.box-shadow-element {\n  box-shadow: ${shadowValue};\n  -webkit-box-shadow: ${shadowValue};\n}\n`;

      const blob = new Blob([content], { type: 'text/css;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'box-shadow.css';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      document.getElementById('statusText').innerText = 'Downloaded box-shadow.css!';
    }

    // Reset back to initial default
    function resetAll() {
      layers = [
        {
          x: 0,
          y: 12,
          blur: 24,
          spread: -4,
          color: '#000000',
          opacity: 0.18,
          inset: false
        }
      ];
      activeLayerIndex = 0;
      setPreviewBg('light');
      updateUI();
      document.getElementById('statusText').innerText = 'Shadow reset to default elevation';
    }

    // Theme Switcher Sync with localStorage
    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      const icon = document.getElementById('themeIcon');
      icon.className = isDark ? 'fa-solid fa-sun text-xs text-amber-400' : 'fa-solid fa-moon text-xs';
      localStorage.setItem('freezip_theme', isDark ? 'dark' : 'light');
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('freezip_theme') === 'dark') {
        document.documentElement.classList.add('dark');
        document.getElementById('themeIcon').className = 'fa-solid fa-sun text-xs text-amber-400';
      }
      updateUI();
    });
  </script>
</body>
</html>
